<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="690" viewBox="0 0 1120 690" aria-labelledby="title desc" role="img">
<title id="title">NEON genus-specific density-associated contrast: exploratory heterogeneity and failed generality test</title>
<desc id="desc">Frozen eight-genus development estimates of beta Delta, where delta equals beta_B minus beta_W in square metres per genus MNKA; five of eight estimates positive, short of the frozen six required. Six genera sampled at three or more sites are shown on scale minus twenty to plus thirty; two single-site genera are shown in a separate signed-value inset without direct numerical x-axis comparison. Values are descriptive, not statistically confirmed effects.</desc>
<rect x="0" y="0" width="1120" height="690" fill="#fff"/>
<text x="42" y="41" font-family="Arial" font-weight="bold" font-size="25" fill="#172d3b">Density responses differ among small-mammal genera</text>
<text x="42" y="66" font-family="Arial" font-size="14" fill="#455968">Frozen NEON RELEASE-2026 development, 1,326 sessions / 40 sites. Contrasts are associations, not experimental density responses.</text>
<text x="42" y="102" font-family="Arial" font-weight="bold" font-size="18" fill="#823c2f">Predeclared generality test: FAIL — 5/8 positive; 6/8 required</text>
<text x="42" y="127" font-family="Arial" font-size="13" fill="#5c6971">Δβ = β(B among individual centres) − β(W within individuals)   [m² per genus-MNKA]</text>
