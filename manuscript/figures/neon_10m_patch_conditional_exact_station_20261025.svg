<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1020" width="1200" height="1020" role="img" aria-labelledby="t d">
<title id="t">10 m patch genus recurrence beyond exact station recurrence: full and site-reuse-disjoint sensitivity</title>
<desc id="d">30 physical-site mean standardized patch scores after conditioning exactly on original same trap genus overlap. 22 of 30 positive and mean Z 0.310 with conditional comonotone p 0.039. Entire source-season-reuse physical-site exclusion leaves 17 sites/50 units, mean Z 0.183 and p 0.221, not supported. Same historic NEON release.</desc>
<rect width="1200" height="1020" fill="#ffffff"/>
<text x="45" y="42" font-family="Arial" font-size="25" font-weight="bold" fill="#15384c">Does recurrence extend beyond the exact trap?</text>
<text x="45" y="70" font-family="Arial" font-size="14" fill="#516a79">NEON 10 m rook-neighbor overlap · exact same-genus same-trap overlap is FIXED in each conditional null</text>
<text x="45" y="93" font-family="Arial" font-size="12" fill="#596e7c">30 physical sites · 153 informative seasonal comparisons · 22 positive site means</text>
