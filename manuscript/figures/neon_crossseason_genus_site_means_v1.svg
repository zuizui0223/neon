<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690" viewBox="0 0 1200 690" role="img" aria-labelledby="title desc">
<title id="title">14 independent NEON site means show positive genus trap-location recurrence after tagged-animal turnover</title>
<desc id="desc">Site-level standardized Z means, sorted by magnitude without site identification. Eleven of fourteen are positive. Grand mean positive 0.801, exact site sign-flip p equals 0.00116. Individual analyses at 58 seasonal pairs are not counted as independent sites.</desc>
