<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1110 635" width="1110" height="635" role="img" aria-labelledby="figTitle figDesc">
<title id="figTitle">Corrected NEON genus-associated seasonal recurrence: 14 sites and source-disjoint 12 sites</title>
<desc id="figDesc">Two anonymized dot charts of physical-site mean null-standardized genus by trap recurrence Z. Full original 14-site cohort has 11 positive site means and average Z 0.795. The independently source-defined 12-site sensitivity has 10 positive site means and average Z 0.843. Site ranks are sorted within each panel and are not paired.</desc>
