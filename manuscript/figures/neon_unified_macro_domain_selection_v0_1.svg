<title id="ttl">NEON source-only geographic selection: qualified mammal genus transitions among all adjacent season candidates</title>
<desc id="ds">Across original 42 candidate physical sites, 803 adjacent season candidate pairs occur in 18 NEON ecological domains but only 58 qualified three-genus pairs at 14 sites across 10 domains. Bars by domain show denominator candidates and qualifying pairs; values do not indicate absence of spatial recurrence. D18 has zero original adjacent-season candidate pairs and is excluded from the plotted conditional fraction.</desc>
