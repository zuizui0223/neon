<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 920" role="img" aria-labelledby="ttl desc"><title id="ttl">Ecological density response in eight small mammal genera and provisional Peromyscus temporal replication</title><desc id="desc">Panel A shows development-only within and between trapped-coordinate variance density coefficients for all eight genera; five of eight genera have positive B minus W response, below preregistered six. Panel B shows a new provisional Peromyscus slope minus 7.07 with broad confidence interval overlapping zero and the development slope positive 15.93. Neither universal packing nor temporal reversal is established.</desc>
