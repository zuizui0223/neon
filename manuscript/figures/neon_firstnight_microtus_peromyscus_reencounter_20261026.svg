<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="560" viewBox="0 0 1050 560" role="img" aria-labelledby="ttl detail">
<title id="ttl">Conditional three-night genus reencounter fractions in source-matched NEON physical sites</title>
<desc id="detail">Microtus firstnight 179 captures, 97 observed again day two or three, pooled 54.19%, equal-site 54.18%. Peromyscus 435 firstnight captures, 330 later observed, pooled 75.86%, equal-site 77.69%. Seven original physical sites, site-equal contrast Microtus minus Peromyscus -23.51 percentage points with 2000 whole-site bootstrap 95% interval -45.70 to -2.37 percentage points. These re-encounters are not actual genus-specific trap detection probabilities and could reflect activity, movement, availability or release fate.</desc>
<rect width="1050" height="560" fill="#fff"/>
<text x="42" y="42" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#173748">Within-bout re-encounters differ by genus</text>
<text x="42" y="68" font-family="Arial, sans-serif" font-size="14" fill="#52707c">First-night marked captures observed again on night 2 or 3 · seven source-matched NEON sites</text>
<text x="42" y="94" font-family="Arial, sans-serif" font-size="12" fill="#617885">Observable recapture history, NOT animal-level detection p or cause of seasonal spatial recurrence</text>
<line x1="42" y1="114" x2="1005" y2="114" stroke="#d4e0e5"/>
<line x1="300" y1="140" x2="300" y2="295" stroke="#e1e9ee" stroke-width="1"/><text x="300" y="319" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#5c7480">0%</text>
<line x1="422" y1="140" x2="422" y2="295" stroke="#e1e9ee" stroke-width="1"/><text x="422" y="319" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#5c7480">20%</text>
<line x1="544" y1="140" x2="544" y2="295" stroke="#e1e9ee" stroke-width="1"/><text x="544" y="319" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#5c7480">40%</text>
<line x1="666" y1="140" x2="666" y2="295" stroke="#e1e9ee" stroke-width="1"/><text x="666" y="319" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#5c7480">60%</text>
<line x1="788" y1="140" x2="788" y2="295" stroke="#e1e9ee" stroke-width="1"/><text x="788" y="319" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#5c7480">80%</text>
<line x1="910" y1="140" x2="910" y2="295" stroke="#e1e9ee" stroke-width="1"/><text x="910" y="319" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#5c7480">100%</text>
<text x="43" y="194" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#284959">Microtus</text>
<text x="43" y="215" font-family="Arial, sans-serif" font-size="12" fill="#587381">97/179 tags</text>
<rect x="300" y="168" width="330.5" height="39" rx="4" fill="#638899"/>
<text x="643.5" y="195" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#638899">54.2%</text>
<text x="43" y="288" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#284959">Peromyscus</text>
<text x="43" y="309" font-family="Arial, sans-serif" font-size="12" fill="#587381">330/435 tags</text>
<rect x="300" y="262" width="473.9" height="39" rx="4" fill="#226b89"/>
<text x="786.9" y="289" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#226b89">77.7%</text>
<line x1="42" y1="365" x2="1005" y2="365" stroke="#d4e0e5"/>
<text x="43" y="402" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#173748">Site-equal Microtus − Peromyscus</text>
<text x="43" y="439" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#285c72">-23.5 percentage points</text>
<text x="43" y="470" font-family="Arial, sans-serif" font-size="15" fill="#425e6f">Whole-site bootstrap 95% interval: -45.7 to -2.4 pp (2,000 samples)</text>
<text x="43" y="513" font-family="Arial, sans-serif" font-size="12" fill="#627986">Seven independent physical sites, each weighted equally. Source pair selected by first-night counts only.</text>
<text x="43" y="535" font-family="Arial, sans-serif" font-size="11" fill="#627986">NEON RELEASE-2026 · historical post-result observation-process analysis · availability, movement and trap reaction remain confounded</text>
</svg>
