<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="710" viewBox="0 0 1100 710" role="img" aria-labelledby="heading explanation">
<title id="heading">Mammal station records versus certified all-six-night trap status opportunities in NEON</title>
<desc id="explanation">Original source-only 158 two-genus seasonal comparisons, 87,916 coded per-trapnight source rows. Although all six nights have a median of 100 recorded stations, the median of same stations coded 4,5,6 in every night is 60. Only 18 of 158 season pairs across eight sites and seven NEON domains retain 90 confirmed 4/5/6 stations. All effects stop at the source coverage gate; no ecology inferred.</desc>
<rect width="1100" height="710" fill="white"/>
<text x="55" y="43" font-family="Arial" font-size="25" font-weight="700" fill="#173949">Recorded traps ≠ documented all-night operability</text>
<text x="55" y="72" font-family="Arial" font-size="14" fill="#4b6370">Original NEON RELEASE-2026 · 158 seasonal pairs · 30 physical sites · 15 ecological domains</text>
<text x="55" y="101" font-family="Arial" font-size="12" fill="#566e79">Official trapStatus categories; 87,916 canonical trap-night source rows, with 26 duplicate station/night records</text>
<line x1="55" y1="124" x2="1040" y2="124" stroke="#d5e0e5"/>
<text x="55" y="153" font-family="Arial" font-size="17" font-weight="700" fill="#1e4659">Source trap-status codes (row-level frequencies)</text>
<text x="55" y="200" font-family="Arial" font-size="13" fill="#345264">6 — Set and empty (recorded functional)</text>
<rect x="425" y="185" width="373.72890031393604" height="30" rx="4" fill="#317b85"/>
<text x="975" y="202" font-family="Arial" font-size="13" font-weight="600" text-anchor="end" fill="#2f5060">64,425 (73.3%)</text>
<text x="55" y="253" font-family="Arial" font-size="13" fill="#345264">5 — Animal captured</text>
<rect x="425" y="238" width="79.63021520542335" height="30" rx="4" fill="#2872a0"/>
<text x="975" y="255" font-family="Arial" font-size="13" font-weight="600" text-anchor="end" fill="#2f5060">13,727 (15.6%)</text>
<text x="55" y="306" font-family="Arial" font-size="13" fill="#345264">4 — >1 animal captured</text>
<rect x="425" y="291" width="0.3306565357841576" height="30" rx="4" fill="#5b9ab3"/>
<text x="975" y="308" font-family="Arial" font-size="13" font-weight="600" text-anchor="end" fill="#2f5060">57 (0.1%)</text>
<text x="55" y="359" font-family="Arial" font-size="13" fill="#345264">3 — Door open, spoor</text>
<rect x="425" y="344" width="28.6452977842486" height="30" rx="4" fill="#d5a15c"/>
<text x="975" y="361" font-family="Arial" font-size="13" font-weight="600" text-anchor="end" fill="#2f5060">4,938 (5.6%)</text>
<text x="55" y="412" font-family="Arial" font-size="13" fill="#345264">2 — Disturbed, closed/empty</text>
<rect x="425" y="397" width="20.268665544383275" height="30" rx="4" fill="#c78558"/>
<text x="975" y="414" font-family="Arial" font-size="13" font-weight="600" text-anchor="end" fill="#2f5060">3,494 (4.0%)</text>
<text x="55" y="465" font-family="Arial" font-size="13" fill="#345264">1 — Not set / not processed</text>
<rect x="425" y="450" width="7.396264616224578" height="30" rx="4" fill="#a76556"/>
<text x="975" y="467" font-family="Arial" font-size="13" font-weight="600" text-anchor="end" fill="#2f5060">1,275 (1.5%)</text>
<line x1="55" y1="511" x2="1040" y2="511" stroke="#d5e0e5"/>
<text x="55" y="541" font-family="Arial" font-size="17" font-weight="700" fill="#1e4659">Conservative all-six-night intersection</text>
<text x="55" y="575" font-family="Arial" font-size="15" fill="#395365">Median canonical positions recorded across all six nights</text>
<text x="907" y="575" font-family="Arial" font-size="24" font-weight="700" fill="#317b85">100</text>
<text x="55" y="613" font-family="Arial" font-size="15" fill="#395365">Median positions classified 4/5/6 on every night</text>
<text x="907" y="613" font-family="Arial" font-size="24" font-weight="700" fill="#b2644e">60</text>
<text x="55" y="648" font-family="Arial" font-size="15" fill="#395365">Season pairs passing ≥90 operability-coded positions and genus support</text>
<text x="907" y="648" font-family="Arial" font-size="21" font-weight="700" fill="#a34a39">18/158</text>
<text x="55" y="680" font-family="Arial" font-size="11" fill="#627986">Interpretation: strict source-feasibility STOP, NOT zero species presence, true nonoperability or negative habitat effect.</text>
</svg>
