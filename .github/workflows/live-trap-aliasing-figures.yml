name: live-trap-aliasing-figures

on:
  push:
    branches:
      - paper/live-trap-aliasing-v1
    paths:
      - analysis/plot_live_trap_aliasing_figures_v1.py
      - results/temporal_aliasing_simulation_benchmark_v2.json
      - results/san_jacinto_positional_aliasing_result_v1.json
      - validation/live_trap_aliasing_v1/denominator_audit_v1.json
      - .github/workflows/live-trap-aliasing-figures.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  figures:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: paper/live-trap-aliasing-v1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install plotting dependencies
        run: python -m pip install numpy==2.1.1 matplotlib==3.10.6
      - name: Render figures
        run: |
          python analysis/plot_live_trap_aliasing_figures_v1.py             --simulation results/temporal_aliasing_simulation_benchmark_v2.json             --validation results/san_jacinto_positional_aliasing_result_v1.json             --denominator validation/live_trap_aliasing_v1/denominator_audit_v1.json             --outdir /tmp/figures
      - name: Persist figure files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin paper/live-trap-aliasing-v1
          mkdir -p figures
          cp /tmp/figures/* figures/
          git add figures
          if git diff --cached --quiet; then
            echo "figures unchanged"
          else
            git commit -m "Render live-trap aliasing manuscript figures"
            git push origin HEAD:paper/live-trap-aliasing-v1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: live-trap-aliasing-figures-v1
          path: /tmp/figures/*
          if-no-files-found: error
          retention-days: 30
