name: multiscale-density-standardized-era-parallel

on:
  push:
    branches:
      - design/multiscale-density-accommodation-v1
    paths:
      - "analysis/audit_multiscale_density_estimability_v1.py"
      - "analysis/run_multiscale_density_estimability_release2026_v3.py"
      - "analysis/validate_multiscale_density_metrics_v1.py"
      - "analysis/simulate_multiscale_density_metric_support_v1.py"
      - "tests/test_multiscale_density_estimability_v1.py"
      - "tests/test_multiscale_density_metric_mechanics_v1.py"
      - "tests/test_multiscale_density_metric_support_simulation_v1.py"
      - "tests/test_multiscale_density_parallel_runner_v3.py"
      - ".github/workflows/multiscale-density-standardized-era-parallel.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: multiscale-density-standardized-era-parallel-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEON_API_TOKEN: ${{ secrets.NEON_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependency
        run: python -m pip install numpy==2.1.1
      - name: Verify frozen code
        run: |
          python -m unittest \
            tests.test_multiscale_density_estimability_v1 \
            tests.test_multiscale_density_metric_mechanics_v1 \
            tests.test_multiscale_density_metric_support_simulation_v1 \
            tests.test_multiscale_density_parallel_runner_v3 \
            -v
      - name: Run synthetic support audit
        run: python -m analysis.simulate_multiscale_density_metric_support_v1
      - name: Require NEON access
        run: test -n "$NEON_API_TOKEN"
      - name: Run parallel standardized structural audit
        run: python -m analysis.run_multiscale_density_estimability_release2026_v3
      - name: Upload receipts
        uses: actions/upload-artifact@v4
        with:
          name: multiscale-density-standardized-era-parallel-v1
          path: |
            build/multiscale_density_estimability_release2026_v1.json
            build/multiscale_density_metric_support_v1.json
          if-no-files-found: error
          retention-days: 30
