name: neon-unified-macro-source-crosswalk

on:
  push:
    branches:
      - design/multiscale-density-accommodation-v1
    paths:
      - "analysis/audit_neon_unified_macro_source_crosswalk_v1.py"
      - "tests/test_neon_unified_macro_source_crosswalk_v1.py"
      - ".github/workflows/neon-unified-macro-source-crosswalk-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: neon-unified-macro-crosswalk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unified-macro-source-only:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NEON_API_TOKEN: ${{ secrets.NEON_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test synthetic original-event crosswalk and false-coupling guards
        run: python -m unittest discover -s tests -p 'test_neon_unified_macro_source_crosswalk_v1.py' -v
      - name: Require pinned original NEON source authorization
        run: test -n "$NEON_API_TOKEN"
      - name: Count exact site plot event coupling support without effects
        run: python -m analysis.audit_neon_unified_macro_source_crosswalk_v1
      - name: Archive aggregate-only source-support receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neon-unified-macro-source-only-crosswalk-v1
          path: build/neon_unified_macro_source_crosswalk_v1.json
          if-no-files-found: warn
          retention-days: 45
