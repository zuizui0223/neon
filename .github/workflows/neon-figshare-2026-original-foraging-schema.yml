name: neon-figshare-2026-original-mouse-vole-foraging-schema
on:
  push:
    branches:
      - design/multiscale-density-accommodation-v1
    paths:
      - 'analysis/audit_neon_figshare_2026_original_foraging_schema_v1.py'
      - 'tests/test_neon_figshare_2026_original_foraging_schema_v1.py'
      - 'docs/NEON_FIGSHARE_2026_MOUSE_VOLE_FORAGING_SCHEMA_GATE_20261121.md'
      - '.github/workflows/neon-figshare-2026-original-foraging-schema.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'analysis/audit_neon_figshare_2026_original_foraging_schema_v1.py'
      - 'tests/test_neon_figshare_2026_original_foraging_schema_v1.py'
      - 'docs/NEON_FIGSHARE_2026_MOUSE_VOLE_FORAGING_SCHEMA_GATE_20261121.md'
      - '.github/workflows/neon-figshare-2026-original-foraging-schema.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: neon-figshare-2026-original-foraging-schema-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source-only-2026-mouse-vole-foraging-capture-station-night-files:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Synthetic original Figshare v2 size MD5 and CSV grammar source checks
        run: python -m unittest discover -s tests -p 'test_neon_figshare_2026_original_foraging_schema_v1.py' -v
      - name: Checksum verify exact five public original 2026 Figshare CSVs, output only source headers
        run: python -m analysis.audit_neon_figshare_2026_original_foraging_schema_v1
      - name: Preserve only verified original source schema or strict STOP receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neon-figshare-2026-capture-foraging-station-nights-headers-only
          path: build/neon_figshare_2026_original_foraging_schema_v1.json
          if-no-files-found: warn
          retention-days: 45
