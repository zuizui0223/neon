name: scr-temporal-collapse-pilot

on:
  push:
    branches:
      - design/san-jacinto-scr-sigma-impact-v1
    paths:
      - docs/SCR_TEMPORAL_COLLAPSE_SIMULATION_DESIGN_V1.md
      - analysis/scr_temporal_collapse_simulation_v1.R
      - .github/workflows/scr-temporal-collapse-pilot.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scr-temporal-collapse-pilot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: design/san-jacinto-scr-sigma-impact-v1

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::secr
            any::jsonlite

      - name: Run temporal-collapse SCR pilot
        run: |
          Rscript analysis/scr_temporal_collapse_simulation_v1.R \
            --replicates 6 \
            --seed 20261003 \
            --output-json /tmp/scr_temporal_collapse_pilot_v1.json \
            --output-csv /tmp/scr_temporal_collapse_pilot_replicates_v1.csv

      - name: Check guardrails and basic output
        run: |
          Rscript - <<'RS'
          library(jsonlite)
          z <- fromJSON("/tmp/scr_temporal_collapse_pilot_v1.json", simplifyVector = FALSE)
          stopifnot(identical(z$interpretation_guardrails$empirical_sigma_effect_opened, FALSE))
          stopifnot(identical(z$interpretation_guardrails$empirical_scr_stop_gate_relaxed, FALSE))
          d <- read.csv("/tmp/scr_temporal_collapse_pilot_replicates_v1.csv")
          stopifnot(nrow(d) == 2 * 4 * 6)
          stopifnot(all(d$checks_per_night %in% 1:4))
          stopifnot(all(d$detectfn %in% c("HN", "HHN")))
          cat("rows:", nrow(d), "\n")
          RS

      - name: Persist pilot results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin design/san-jacinto-scr-sigma-impact-v1
          mkdir -p results
          cp /tmp/scr_temporal_collapse_pilot_v1.json results/
          cp /tmp/scr_temporal_collapse_pilot_replicates_v1.csv results/
          git add results/scr_temporal_collapse_pilot_v1.json
          git add results/scr_temporal_collapse_pilot_replicates_v1.csv
          if git diff --cached --quiet; then
            echo "pilot results unchanged"
          else
            git commit -m "Run SCR temporal-collapse pilot"
            git push origin HEAD:design/san-jacinto-scr-sigma-impact-v1
          fi
