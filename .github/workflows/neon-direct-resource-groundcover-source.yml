name: neon-direct-resource-groundcover-source
on:
  push:
    branches: [design/multiscale-density-accommodation-v1]
    paths:
      - 'analysis/audit_neon_direct_resource_groundcover_source_v1.py'
      - 'tests/test_neon_direct_resource_groundcover_source_v1.py'
      - 'docs/NEON_DIRECT_RESOURCE_GROUNDCOVER_SOURCE_GATE_20261124.md'
      - '.github/workflows/neon-direct-resource-groundcover-source.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: neon-direct-resource-groundcover-source-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source-inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install openpyxl==3.1.5
      - run: python -m unittest discover -s tests -p 'test_neon_direct_resource_groundcover_source_v1.py' -v
      - run: python -m analysis.audit_neon_direct_resource_groundcover_source_v1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: neon-direct-resource-groundcover-source-inventory
          path: build/neon_direct_resource_groundcover_source_20261124.json
          if-no-files-found: error
          retention-days: 45
