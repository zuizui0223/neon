name: multiscale-density-centroid-geometry

on:
  push:
    branches:
      - design/multiscale-density-accommodation-v1
    paths:
      - "analysis/audit_multiscale_density_centroid_geometry_v1.py"
      - "analysis/run_multiscale_density_metric_qc_v1.py"
      - "analysis/run_multiscale_density_estimability_release2026_v3.py"
      - "tests/test_neon_download_integrity_retry_v1.py"
      - "tests/test_multiscale_density_centroid_geometry_v1.py"
      - "docs/MULTISCALE_DENSITY_CENTROID_GEOMETRY_CONTRACT_V1.md"
      - ".github/workflows/multiscale-density-centroid-geometry.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: multiscale-density-centroid-geometry-${{ github.ref }}
  cancel-in-progress: true

jobs:
  geometry:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      NEON_API_TOKEN: ${{ secrets.NEON_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install fixed model dependency
        run: python -m pip install numpy==2.1.1
      - name: Verify pure geometry and default frozen model
        run: |
          python -m unittest discover -s tests -p 'test_multiscale_density_centroid_geometry_v1.py' -v
          python -m unittest tests.test_multiscale_density_fixed_effects_v1 -v
          python -m unittest discover -s tests -p 'test_neon_download_integrity_retry_v1.py' -v
      - name: Require NEON access
        run: test -n "$NEON_API_TOKEN"
      - name: Run post-result matched-cohort spatial geometry audit
        run: python -m analysis.audit_multiscale_density_centroid_geometry_v1
      - name: Archive derived result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: multiscale-density-centroid-geometry-v1
          path: |
            build/multiscale_density_centroid_geometry_v1.json
            build/multiscale_density_centroid_session_diagnostics_v1.json
          if-no-files-found: warn
          retention-days: 30
