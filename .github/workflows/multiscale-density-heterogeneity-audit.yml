name: multiscale-density-heterogeneity-audit

on:
  push:
    branches:
      - design/multiscale-density-accommodation-v1
    paths:
      - "analysis/audit_multiscale_density_heterogeneity_v1.py"
      - "results/multiscale_density_development_result_v1.json"
      - ".github/workflows/multiscale-density-heterogeneity-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: macos-14
    timeout-minutes: 30
    env:
      NEON_API_TOKEN: ${{ secrets.NEON_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependency
        run: python -m pip install numpy==2.1.1
      - name: Require NEON access
        run: test -n "$NEON_API_TOKEN"
      - name: Run descriptive heterogeneity audit
        run: python -m analysis.audit_multiscale_density_heterogeneity_v1
      - name: Upload heterogeneity receipt
        uses: actions/upload-artifact@v4
        with:
          name: multiscale-density-heterogeneity-audit-v1
          path: build/multiscale_density_heterogeneity_diagnostic_v1.json
          if-no-files-found: error
          retention-days: 30
