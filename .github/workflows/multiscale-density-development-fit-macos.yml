name: multiscale-density-development-fit-macos

on:
  push:
    branches:
      - design/multiscale-density-accommodation-v1
    paths:
      - ".github/workflows/multiscale-density-development-fit-macos.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fit:
    runs-on: macos-14
    timeout-minutes: 30
    env:
      NEON_API_TOKEN: ${{ secrets.NEON_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install model dependency
        run: python -m pip install numpy==2.1.1
      - name: Test frozen fixed-effects estimator
        run: python -m unittest tests.test_multiscale_density_fixed_effects_v1 -v
      - name: Require NEON access
        run: test -n "$NEON_API_TOKEN"
      - name: Run identical frozen development fit
        run: python -m analysis.run_multiscale_density_development_fit_v1
      - name: Upload development result
        uses: actions/upload-artifact@v4
        with:
          name: multiscale-density-development-fit-macos-v1
          path: build/multiscale_density_development_fit_v1.json
          if-no-files-found: error
          retention-days: 30
