name: neon-seasonal-seed-role-source
on:
  push:
    branches: [design/multiscale-density-accommodation-v1]
    paths:
      - 'analysis/audit_neon_seasonal_seed_role_source_v1.py'
      - 'tests/test_neon_seasonal_seed_role_source_v1.py'
      - '.github/workflows/neon-seasonal-seed-role-source.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-seasonal-source:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install openpyxl==3.1.5
      - run: python -m unittest discover -s tests -p 'test_neon_seasonal_seed_role_source_v1.py' -v
      - run: python -m analysis.audit_neon_seasonal_seed_role_source_v1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: neon-seasonal-seed-role-source
          path: build/neon_seasonal_seed_role_source_20261124.json
          if-no-files-found: error
          retention-days: 45
