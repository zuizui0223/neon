name: carrier-prevalence-response-once

on:
  push:
    branches:
      - analysis/carrier-prevalence-response-v1
    paths:
      - validation/carrier_prevalence_mechanism_v1/response_authorization_v1.json

permissions:
  contents: write

jobs:
  response:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: analysis/carrier-prevalence-response-v1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install response dependency
        run: python -m pip install numpy==2.1.1
      - name: Execute once-only biological response
        id: response
        env:
          NEON_API_TOKEN: ${{ secrets.NEON_API_TOKEN }}
        run: |
          set +e
          python analysis/run_carrier_prevalence_response_once_v1.py
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          if [ -f results/carrier_prevalence_response_v1.json ]; then
            requests=$(python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path("results/carrier_prevalence_response_v1.json").read_text())
          print(int(p.get("response_endpoint_requests",0)))
          PY
          )
          else
            requests=0
          fi
          echo "response_requests=$requests" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Persist consumed response result
        if: steps.response.outputs.response_requests != '0'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/carrier_prevalence_response_v1.json
          git commit -m "Freeze once-only carrier prevalence response"
          git push origin HEAD:analysis/carrier-prevalence-response-v1
      - name: Enforce response runner exit state
        run: |
          code="${{ steps.response.outputs.exit_code }}"
          if [ "$code" != "0" ]; then
            echo "once-only response runner exited with code $code"
            exit "$code"
          fi
