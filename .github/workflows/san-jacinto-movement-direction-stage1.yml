name: san-jacinto-movement-direction-stage1

on:
  push:
    branches:
      - ecology/san-jacinto-transition-niche-v1
    paths:
      - .github/workflows/san-jacinto-movement-direction-stage1.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: san-jacinto-movement-direction-stage1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  closed:
    runs-on: ubuntu-latest
    steps:
      - name: Stage 1 is closed
        run: |
          echo "Stage 1 frozen movement-direction test is closed."
          echo "Result: stop_no_directional_maintenance_support."
          echo "Do not rerun or reopen species-pair/alternative movement metrics as rescue analyses."
