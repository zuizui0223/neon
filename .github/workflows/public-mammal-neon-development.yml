name: public-mammal-neon-development

on:
  push:
    branches:
      - design/public-mammal-space-use-v1
    paths:
      - analysis/build_neon_space_use_sessions_v1.py
      - analysis/run_neon_space_use_development_v1.py
      - analysis/mammal_spatial_packing_v1.py
      - validation/public_mammal_space_use_v1/source_manifest_v1.json
      - .github/workflows/public-mammal-neon-development.yml
  workflow_dispatch:

jobs:
  neon-development:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install numerical dependency
        run: python -m pip install numpy==2.1.1
      - name: Require NEON token
        env:
          NEON_API_TOKEN: ${{ secrets.NEON_API_TOKEN }}
        run: |
          if [ -z "$NEON_API_TOKEN" ]; then
            echo "::error::NEON_API_TOKEN repository secret is required."
            exit 3
          fi
      - name: Build NEON diversity-grid development sessions
        env:
          NEON_API_TOKEN: ${{ secrets.NEON_API_TOKEN }}
        run: |
          python analysis/run_neon_space_use_development_v1.py \
            --output-dir results/generated \
            --replicates 999
      - name: Assert development-only output
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path("results/generated/neon_space_use_inventory_v1.json").read_text())
          assert p["product_code"] == "DP1.10072.001"
          assert p["release"] == "RELEASE-2026"
          assert p["inferential_status"] == "retrospective_development_only"
          assert p["ecological_model_fits"] == 0
          assert p["session_count"] > 0
          assert p["site_count"] > 0
          print(json.dumps({
              "session_count":p["session_count"],
              "eligible_n3":p["eligible_n3"],
              "eligible_n5":p["eligible_n5"],
              "eligible_n8":p["eligible_n8"],
              "species_count":p["species_count"],
              "site_count":p["site_count"],
              "site_stops":p["site_stops"],
          },indent=2,sort_keys=True))
          PY
      - name: Upload NEON development tables
        uses: actions/upload-artifact@v4
        with:
          name: public-mammal-neon-development-v1
          path: |
            results/generated/neon_diversity_space_use_sessions_v1.csv
            results/generated/neon_space_use_inventory_v1.json
            results/generated/neon_taxonomy_uncertainty_v1.csv
          if-no-files-found: error
          retention-days: 30
