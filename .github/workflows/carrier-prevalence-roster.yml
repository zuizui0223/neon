name: carrier-prevalence-fresh-roster

on:
  push:
    branches:
      - analysis/carrier-niche-role-v1
    paths:
      - validation/carrier_prevalence_mechanism_v1/protocol_v1.json
      - analysis/capture_carrier_prevalence_fresh_roster_v1.py
      - .github/workflows/carrier-prevalence-roster.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  freeze-roster:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: analysis/carrier-niche-role-v1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependency
        run: python -m pip install numpy==2.1.1
      - name: Capture response-blind fresh roster
        run: python analysis/capture_carrier_prevalence_fresh_roster_v1.py
      - name: Upload fresh roster before repository persistence
        uses: actions/upload-artifact@v4
        with:
          name: carrier-prevalence-fresh-roster-v1
          path: results/generated/carrier_prevalence_fresh_roster_v1.json
          if-no-files-found: error
          retention-days: 30
      - name: Persist response-blind roster lock on latest branch head
        run: |
          cp results/generated/carrier_prevalence_fresh_roster_v1.json /tmp/carrier_prevalence_fresh_roster_v1.json
          git fetch origin analysis/carrier-niche-role-v1
          git reset --hard origin/analysis/carrier-niche-role-v1
          cp /tmp/carrier_prevalence_fresh_roster_v1.json validation/carrier_prevalence_mechanism_v1/fresh_roster_lock_v1.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add validation/carrier_prevalence_mechanism_v1/fresh_roster_lock_v1.json
          if git diff --cached --quiet; then
            echo "roster lock unchanged"
          else
            git commit -m "Freeze response-blind carrier-prevalence roster"
            git push origin HEAD:analysis/carrier-niche-role-v1
          fi
