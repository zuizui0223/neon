name: future-neon-capture-support-blind

on:
  push:
    branches:
      - design/multiscale-density-accommodation-v1
    paths:
      - "analysis/audit_future_neon_capture_support_v1.py"
      - "analysis/audit_future_neon_mnka_support_v1.py"
      - "tests/test_future_neon_mnka_support_v1.py"
      - "analysis/audit_future_neon_plot_structure_v1.py"
      - "tests/test_future_neon_capture_support_v1.py"
      - ".github/workflows/future-neon-capture-support-blind.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  support:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEON_API_TOKEN: ${{ secrets.NEON_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test effect-blind support and complete-bout selection
        run: |
          python -m unittest discover -s tests -p 'test_future_neon_capture_support_v1.py' -v
          python -m unittest discover -s tests -p 'test_future_neon_mnka_support_v1.py' -v
      - name: Verify NEON token
        run: test -n "$NEON_API_TOKEN"
      - name: Count locked target repeats without opening W B or abundance effects
        run: python -m analysis.audit_future_neon_capture_support_v1
      - name: Archive structural support only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: future-neon-capture-support-blind-v1
          path: build/future_neon_capture_support_v1.json
          if-no-files-found: warn
          retention-days: 35
