name: neon-macro-temporal-lag-ecology

on:
  push:
    branches:
      - design/multiscale-density-accommodation-v1
    paths:
      - "analysis/neon_macro_site_fixed_lag_model_v1.py"
      - "analysis/run_neon_macro_temporal_lag_ecology_v1.py"
      - "tests/test_neon_macro_site_fixed_lag_model_v1.py"
      - ".github/workflows/neon-macro-temporal-lag-ecology.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: neon-macro-temporal-lag-ecology-${{ github.ref }}
  cancel-in-progress: true

jobs:
  original-exact-two-temporal-ecology:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NEON_API_TOKEN: ${{ secrets.NEON_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned numerical library
        run: python -m pip install numpy==2.1.1
      - name: Verify site fixed effects, transition controls and whole-site bootstrap on synthetic data
        run: |
          python -m unittest discover -s tests -p 'test_neon_macro_site_fixed_lag_model_v1.py' -v
          python -m unittest discover -s tests -p 'test_neon_exact_two_row_fixedmargin_v1.py' -v
      - name: Require pinned original mammal release API authorization
        run: test -n "$NEON_API_TOKEN"
      - name: Estimate source-gated original site-adjusted ecological temporal persistence slope
        run: python -m analysis.run_neon_macro_temporal_lag_ecology_v1
      - name: Archive original-source safe ecological lag or STOP result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neon-macro-temporal-lag-site-fixed-effect-v1
          path: build/neon_macro_temporal_lag_ecology_v1.json
          if-no-files-found: warn
          retention-days: 45
