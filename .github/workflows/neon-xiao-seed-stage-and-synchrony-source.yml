name: neon-xiao-seed-stage-and-synchrony-source
on:
  push:
    branches: [design/multiscale-density-accommodation-v1]
    paths:
      - 'analysis/run_neon_xiao_seed_stage_v1.py'
      - 'tests/test_neon_xiao_seed_stage_v1.py'
      - '.github/workflows/neon-xiao-seed-stage-and-synchrony-source.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fixed-stage-and-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install openpyxl==3.1.5 xlrd==2.0.1
      - run: python -m unittest discover -s tests -p 'test_neon_xiao_seed_stage_v1.py' -v
      - run: python -m analysis.run_neon_xiao_seed_stage_v1
      - uses: actions/upload-artifact@v4
        with:
          name: neon-xiao-seed-stage-and-synchrony-source
          path: build/neon_xiao_seed_stage_2016_20261124.json
          if-no-files-found: error
