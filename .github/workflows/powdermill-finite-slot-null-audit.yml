name: powdermill-finite-slot-null-audit

on:
  push:
    branches:
      - design/powdermill-crossscale-source-v1
    paths:
      - analysis/finite_slot_packing_exact_v1.py
      - tests/test_finite_slot_packing_exact.py
      - .github/workflows/powdermill-finite-slot-null-audit.yml
  workflow_dispatch:

jobs:
  exact-slot-null:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: design/powdermill-crossscale-source-v1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install numerical dependency
        run: python -m pip install numpy==2.1.1
      - name: Verify exact finite-slot moments and support
        run: python -m unittest tests.test_finite_slot_packing_exact -v
