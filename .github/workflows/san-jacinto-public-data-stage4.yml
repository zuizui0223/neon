name: san-jacinto-public-data-stage4

on:
  push:
    branches:
      - ecology/san-jacinto-transition-niche-v1
    paths:
      - .github/workflows/san-jacinto-public-data-stage4.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: san-jacinto-public-data-stage4-${{ github.ref }}
  cancel-in-progress: true

jobs:
  closed:
    runs-on: ubuntu-latest
    steps:
      - name: Stage 4 is closed
        run: |
          echo "Stage 4 public-data temporal scale decomposition is complete."
          echo "Primary classification: between_night_footprint."
          echo "Independent implementations agree: NIGHT-FIRST retains 7/8; ANCHOR retains 0/8."
          echo "Do not reopen alternate thresholds, anchor definitions, or species-pair searches."
