name: neon-3000-original-rest-only-source
on:
  push:
    branches:
      - design/multiscale-density-accommodation-v1
    paths:
      - "analysis/run_neon_3000_station_dated_rest_v1.py"
      - "tests/test_neon_3000_station_rest_only_v1.py"
      - "docs/NEON_3000_REST_ONLY_SOURCE_GATE_20261028.md"
      - ".github/workflows/neon-3000-original-rest-only-source.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: neon-original-rest-3000-stations-${{ github.ref }}
  cancel-in-progress: true
jobs:
  official-rest-source:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      NEON_API_TOKEN: ${{ secrets.NEON_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate synthetic source and existing historic geometry checks
        run: |
          python -m unittest discover -s tests -p 'test_neon_3000_station_rest_only_v1.py' -v
          python -m unittest discover -s tests -p 'test_neon_dated_3000_graphql_source_v1.py' -v
          python -m unittest discover -s tests -p 'test_neon_dated_station_location_v1.py' -v
      - name: Check source auth
        run: test -n "$NEON_API_TOKEN"
      - name: Query 3000 official REST location histories with frozen original 34800 capture-day attempts
        run: python -m analysis.run_neon_3000_station_dated_rest_v1
      - name: Preserve source-only private-safe aggregate receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neon-3000-original-rest-historical-location-source-v1
          path: build/neon_3000_station_dated_rest_v1.json
          if-no-files-found: warn
          retention-days: 45
