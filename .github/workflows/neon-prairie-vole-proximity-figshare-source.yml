name: neon-prairie-vole-proximity-figshare-source
on:
  push:
    branches:
      - design/multiscale-density-accommodation-v1
    paths:
      - 'analysis/audit_neon_prairie_vole_proxlog_source_v1.py'
      - 'tests/test_neon_prairie_vole_proxlog_source_v1.py'
      - 'docs/NEON_PRAIRIE_VOLE_INDEPENDENT_PROXLOG_SOURCE_20261115.md'
      - '.github/workflows/neon-prairie-vole-proximity-figshare-source.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: neon-prairie-vole-figshare-source-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify-original-published-proxlog-trapping-source:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate source inventory hashes without animal records
        run: python -m unittest discover -s tests -p 'test_neon_prairie_vole_proxlog_source_v1.py' -v
      - name: Retrieve only official published Figshare project/article/file metadata
        run: python -m analysis.audit_neon_prairie_vole_proxlog_source_v1
      - name: Preserve only source article file metadata or explicit STOP
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neon-prairie-vole-figshare-source-only
          path: build/neon_prairie_vole_proxlog_figshare_metadata_20261115.json
          retention-days: 45
          if-no-files-found: warn
