name: neon-yang-marginal-flag-audit
on:
  push:
    branches: [design/multiscale-density-accommodation-v1]
    paths:
      - 'analysis/run_neon_yang_marginal_flag_audit_v1.py'
      - 'tests/test_neon_yang_marginal_flag_audit_v1.py'
      - '.github/workflows/neon-yang-marginal-flag-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install openpyxl==3.1.5
      - run: python -m unittest discover -s tests -p 'test_neon_yang_marginal_flag_audit_v1.py' -v
      - run: python -m analysis.run_neon_yang_marginal_flag_audit_v1
      - uses: actions/upload-artifact@v4
        with:
          name: neon-yang-marginal-flag-audit
          path: build/neon_yang_marginal_flag_audit_20261124.json
          if-no-files-found: error
