name: public-mammal-portal-development

on:
  push:
    branches:
      - design/public-mammal-space-use-v1
    paths:
      - analysis/build_portal_space_use_sessions_v1.py
      - analysis/mammal_spatial_packing_v1.py
      - validation/public_mammal_space_use_v1/source_manifest_v1.json
      - .github/workflows/public-mammal-portal-development.yml
  workflow_dispatch:

jobs:
  portal-development:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install numerical dependency
        run: python -m pip install numpy==2.1.1
      - name: Download pinned Portal public files
        run: |
          python - <<'PY'
          from pathlib import Path
          import urllib.request

          sha="72d7ff8568052763bf6899dc462e285684cf20f6"
          paths=[
              "Rodents/Portal_rodent.csv",
              "Rodents/Portal_rodent_trapping.csv",
              "Rodents/Portal_rodent_species.csv",
              "SiteandMethods/Portal_plots.csv",
              "SiteandMethods/Portal_UTMCoords.csv",
          ]
          root=Path("data/cache/portal")
          for path in paths:
              out=root/path
              out.parent.mkdir(parents=True,exist_ok=True)
              url=f"https://raw.githubusercontent.com/weecology/PortalData/{sha}/{path}"
              request=urllib.request.Request(url,headers={"User-Agent":"neon-public-mammal-development/1.0"})
              with urllib.request.urlopen(request,timeout=180) as response:
                  raw=response.read()
              if not raw:
                  raise RuntimeError(f"empty Portal source file: {path}")
              out.write_bytes(raw)
              print(path,len(raw))
          PY
      - name: Build Portal spatial-packing development sessions
        run: |
          python analysis/build_portal_space_use_sessions_v1.py             --portal-dir data/cache/portal             --output-dir results/generated             --replicates 999
      - name: Assert development-only output
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path("results/generated/portal_space_use_inventory_v1.json").read_text())
          assert p["ecological_model_fits"] == 0
          assert p["portal_commit_sha"] == "72d7ff8568052763bf6899dc462e285684cf20f6"
          assert p["session_count"] > 0
          print(json.dumps(p,indent=2,sort_keys=True))
          PY
      - name: Upload Portal development tables
        uses: actions/upload-artifact@v4
        with:
          name: public-mammal-portal-development-v1
          path: |
            results/generated/portal_space_use_sessions_v1.csv
            results/generated/portal_space_use_inventory_v1.json
          if-no-files-found: error
          retention-days: 30
