name: san-jacinto-capture-history-niche-sensitivity-v1

on:
  push:
    branches:
      - analysis/trap-mediated-niche-v1
    paths:
      - analysis/san_jacinto_capture_history_niche_sensitivity_v1.R
      - docs/SAN_JACINTO_CAPTURE_HISTORY_NICHE_SENSITIVITY_V1.md
      - .github/workflows/san-jacinto-capture-history-niche-sensitivity-v1.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sensitivity:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            github::GotelliLab/EcoSimR
            any::jsonlite

      - name: Download and verify public source
        run: |
          mkdir -p /tmp/sj
          curl -L --fail --retry 3 \
            https://ndownloader.figshare.com/files/33058799 \
            -o /tmp/sj/year_round_trap_data.csv
          echo "ec70b40fdcc66a3f9c07a3fda64b5eda06d251a899b9bc99cc5c5dff8c4ab301  /tmp/sj/year_round_trap_data.csv" | sha256sum -c -

      - name: Run original-style versus first-only niche sensitivity
        run: |
          Rscript analysis/san_jacinto_capture_history_niche_sensitivity_v1.R \
            /tmp/sj/year_round_trap_data.csv \
            /tmp/sj/capture_history_niche_sensitivity_v1.json \
            5000 5000 20261007

      - name: Print compact summary
        run: |
          python - <<'PY'
          import json
          p=json.load(open("/tmp/sj/capture_history_niche_sensitivity_v1.json"))
          print(json.dumps({
            "support":p["support"],
            "reproduction":p["reproduction"],
            "sensitivity":p["sensitivity"],
          },indent=2))
          PY

      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: san-jacinto-capture-history-niche-sensitivity-v1
          path: /tmp/sj/capture_history_niche_sensitivity_v1.json
          if-no-files-found: error
          retention-days: 30
