name: multiscale-density-bout-schema

on:
  push:
    branches:
      - design/multiscale-density-accommodation-v1
    paths:
      - "analysis/diagnose_multiscale_density_bout_schema_v1.py"
      - ".github/workflows/multiscale-density-bout-schema.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: multiscale-density-bout-schema-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEON_API_TOKEN: ${{ secrets.NEON_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Require NEON access
        run: test -n "$NEON_API_TOKEN"
      - name: Diagnose bout grouping from perplotnight only
        run: python -m analysis.diagnose_multiscale_density_bout_schema_v1
      - name: Upload bout-schema receipt
        uses: actions/upload-artifact@v4
        with:
          name: multiscale-density-bout-schema-v1
          path: build/multiscale_density_bout_schema_diagnostic_v1.json
          if-no-files-found: error
          retention-days: 30
