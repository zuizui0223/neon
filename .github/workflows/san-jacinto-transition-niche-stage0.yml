name: san-jacinto-transition-niche-stage0

on:
  push:
    branches:
      - ecology/san-jacinto-transition-niche-v1
    paths:
      - analysis/inventory_san_jacinto_transition_niche_v1.py
      - tests/test_san_jacinto_transition_niche_inventory_v1.py
      - .github/workflows/san-jacinto-transition-niche-stage0.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ecology/san-jacinto-transition-niche-v1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify Stage-0 inventory logic
        run: python -m unittest tests.test_san_jacinto_transition_niche_inventory_v1 -v

      - name: Run Figshare and capture feasibility inventory
        run: |
          python analysis/inventory_san_jacinto_transition_niche_v1.py \
            --output /tmp/san_jacinto_transition_niche_inventory_v1.json

      - name: Persist Stage-0 inventory
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin ecology/san-jacinto-transition-niche-v1
          cp /tmp/san_jacinto_transition_niche_inventory_v1.json \
             results/san_jacinto_transition_niche_inventory_v1.json
          git add results/san_jacinto_transition_niche_inventory_v1.json
          if git diff --cached --quiet; then
            echo "inventory unchanged"
          else
            git commit -m "Record San Jacinto transition-niche feasibility inventory"
            git push origin HEAD:ecology/san-jacinto-transition-niche-v1
          fi
