name: neon-holt-acorn-date-repair
on:
  push:
    branches: [design/multiscale-density-accommodation-v1]
    paths:
      - 'analysis/run_neon_holt_acorn_date_repair_v2.py'
      - 'tests/test_neon_holt_acorn_date_repair_v2.py'
      - '.github/workflows/neon-holt-acorn-date-repair.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-frozen-date-repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p 'test_neon_holt_acorn_date_repair_v2.py' -v
      - run: python -m analysis.run_neon_holt_acorn_date_repair_v2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: neon-holt-acorn-date-repair
          path: build/neon_holt_acorn_date_repair_20261124.json
          if-no-files-found: error
          retention-days: 45
