name: neon-matched-species-pregnancy-season
on:
  push:
    branches: [design/multiscale-density-accommodation-v1]
    paths:
      - 'analysis/run_neon_matched_species_pregnancy_season_v1.py'
      - 'tests/test_neon_matched_species_pregnancy_season_v1.py'
      - '.github/workflows/neon-matched-species-pregnancy-season.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  shard:
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        index: [0, 1, 2, 3]
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      NEON_API_TOKEN: ${{ secrets.NEON_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p 'test_neon_matched_species_pregnancy_season_v1.py' -v
      - run: python -m analysis.run_neon_matched_species_pregnancy_season_v1 shard ${{ matrix.index }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: neon-repro-season-shard-${{ matrix.index }}
          path: build/neon_repro_season_shard_${{ matrix.index }}.json
          if-no-files-found: warn
  combine:
    needs: [shard]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: neon-repro-season-shard-*
          path: build/shards
      - run: python -m analysis.run_neon_matched_species_pregnancy_season_v1 combine build/shards
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: neon-matched-species-pregnancy-season
          path: build/neon_matched_species_pregnancy_season_20261125.json
          if-no-files-found: warn
