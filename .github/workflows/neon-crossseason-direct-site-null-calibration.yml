name: neon-crossseason-direct-site-null-calibration

on:
  push:
    branches:
      - design/multiscale-density-accommodation-v1
    paths:
      - "analysis/neon_crossseason_template_null_v1.py"
      - "analysis/neon_crossseason_direct_site_null_v1.py"
      - "analysis/run_neon_crossseason_direct_site_null_calibration_v1.py"
      - "tests/test_neon_crossseason_direct_site_null_v1.py"
      - "tests/test_neon_crossseason_template_null_v1.py"
      - ".github/workflows/neon-crossseason-direct-site-null-calibration.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: neon-direct-site-null-calibration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  replay-and-calibrate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      NEON_API_TOKEN: ${{ secrets.NEON_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify original fixed-fixed null unchanged and direct-site calibration synthetic tests
        run: |
          python -m unittest discover -s tests -p 'test_neon_crossseason_template_null_v1.py' -v
          python -m unittest discover -s tests -p 'test_neon_crossseason_direct_site_null_v1.py' -v
      - name: Require original authorized immutable NEON RELEASE-2026
        run: test -n "$NEON_API_TOKEN"
      - name: Reproduce 58 original source unit Z then calibrate 14-site meta-null directly
        run: python -m analysis.run_neon_crossseason_direct_site_null_calibration_v1
      - name: Save only aggregate calibrated p and source/MCMC replay receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neon-crossseason-direct-site-null-post-result-calibration
          path: build/neon_crossseason_direct_site_null_calibration_v1.json
          if-no-files-found: warn
          retention-days: 45
