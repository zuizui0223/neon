name: neon-original-tower-month-parser-differential

on:
  push:
    branches:
      - design/multiscale-density-accommodation-v1
    paths:
      - "analysis/run_neon_tower_month_parser_differential_v1.py"
      - "tests/test_neon_tower_month_parser_differential_v1.py"
      - ".github/workflows/neon-original-tower-month-parser-differential.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: neon-original-tower-month-parser-${{ github.ref }}
  cancel-in-progress: true

jobs:
  one-original-source-month-metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      NEON_API_TOKEN: ${{ secrets.NEON_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test source filename diagnostics and no private source identifiers
        run: python -m unittest discover -s tests -p 'test_neon_tower_month_parser_differential_v1.py' -v
      - name: Require original NEON release authorization
        run: test -n "$NEON_API_TOKEN"
      - name: Compare two original-month file selection paths on same provider response
        run: python -m analysis.run_neon_tower_month_parser_differential_v1
      - name: Archive sanitized parser reason categories only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neon-original-tower-month-parser-differential-v1
          path: build/neon_original_tower_month_parser_difference_v1.json
          if-no-files-found: warn
          retention-days: 45
