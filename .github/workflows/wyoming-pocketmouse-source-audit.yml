name: wyoming-pocketmouse-source-audit

on:
  push:
    branches:
      - design/wyoming-pocketmouse-crossscale-source-v1
    paths:
      - docs/WYOMING_POCKETMOUSE_CROSSSCALE_SOURCE_AUDIT_V1.md
      - analysis/audit_wyoming_pocketmouse_source_v1.py
      - tests/test_wyoming_pocketmouse_source_audit.py
      - .github/workflows/wyoming-pocketmouse-source-audit.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  source-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: design/wyoming-pocketmouse-crossscale-source-v1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify source-audit tests
        run: python -m unittest tests.test_wyoming_pocketmouse_source_audit -v

      - name: Download frozen University of Wyoming source ZIP
        run: |
          set -euo pipefail
          mkdir -p data/cache/wyoming
          URL="https://pathfinder.arcc.uwyo.edu/publications/ZooPhys/Harkins_etal_OriginalData.zip"
          OUT="data/cache/wyoming/Harkins_etal_OriginalData.zip"

          curl -L --fail --retry 4 --retry-delay 5 --connect-timeout 30 --max-time 600 \
            -A "Mozilla/5.0 wyoming-pocketmouse-source-audit/1.0" \
            "$URL" -o "$OUT"

          test -s "$OUT"
          python - <<'PY'
          from pathlib import Path
          import zipfile
          p=Path("data/cache/wyoming/Harkins_etal_OriginalData.zip")
          assert p.stat().st_size > 10000, p.stat().st_size
          assert zipfile.is_zipfile(p)
          print("ZIP_BYTES",p.stat().st_size)
          PY
          sha256sum "$OUT"

      - name: Audit archive schemas only
        run: |
          python analysis/audit_wyoming_pocketmouse_source_v1.py \
            --zip "data/cache/wyoming/Harkins_etal_OriginalData.zip" \
            --output /tmp/wyoming_pocketmouse_source_schema_audit_v1.json

      - name: Assert effect-blind source audit
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(
              Path("/tmp/wyoming_pocketmouse_source_schema_audit_v1.json").read_text()
          )
          assert p["dipodomys_ordii_future_effect_excluded"] is True
          assert p["species_specific_counts_inspected"] is False
          assert p["sex_specific_counts_inspected"] is False
          assert p["movement_distances_computed"] is False
          assert p["packing_effects_computed"] is False
          assert p["ecological_effect_models_fit"] == 0
          print(json.dumps({
              "source_zip_sha256":p["source_zip_sha256"],
              "source_adequacy_for_estimability_design":
                  p["source_adequacy_for_estimability_design"],
              "adequate_capture_tables":p["adequate_capture_tables"],
          },indent=2,sort_keys=True))
          PY

      - name: Persist source-schema receipt
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin design/wyoming-pocketmouse-crossscale-source-v1
          mkdir -p validation/wyoming_pocketmouse_crossscale_v1
          cp /tmp/wyoming_pocketmouse_source_schema_audit_v1.json \
             validation/wyoming_pocketmouse_crossscale_v1/source_schema_audit_v1.json
          git add validation/wyoming_pocketmouse_crossscale_v1/source_schema_audit_v1.json
          if git diff --cached --quiet; then
            echo "source schema receipt unchanged"
          else
            git commit -m "Freeze Wyoming pocket-mouse source schema audit"
            git push origin HEAD:design/wyoming-pocketmouse-crossscale-source-v1
          fi

      - name: Upload source schema receipt
        uses: actions/upload-artifact@v4
        with:
          name: wyoming-pocketmouse-source-audit-v1
          path: /tmp/wyoming_pocketmouse_source_schema_audit_v1.json
          if-no-files-found: error
          retention-days: 30
