name: san-jacinto-scr-sigma-downstream-simulation

on:
  push:
    branches:
      - design/san-jacinto-scr-sigma-impact-v1
    paths:
      - docs/SAN_JACINTO_SCR_SIGMA_SIMULATION_DESIGN_V1.md
      - analysis/simulate_san_jacinto_scr_sigma_downstream_v1.py
      - tests/test_san_jacinto_scr_sigma_downstream_simulation.py
      - .github/workflows/san-jacinto-scr-sigma-downstream-simulation.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  simulate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: design/san-jacinto-scr-sigma-impact-v1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install simulation dependencies
        run: python -m pip install --upgrade numpy scipy

      - name: Test simulation implementation
        run: python -m unittest tests.test_san_jacinto_scr_sigma_downstream_simulation -v

      - name: Run frozen downstream benchmark
        run: |
          python analysis/simulate_san_jacinto_scr_sigma_downstream_v1.py \
            --replicates 100 \
            --seed 20261003 \
            --output /tmp/san_jacinto_scr_sigma_downstream_simulation_v1.json

      - name: Validate benchmark controls
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('/tmp/san_jacinto_scr_sigma_downstream_simulation_v1.json').read_text())
          assert p['replicates_per_cell'] == 100
          assert len(p['cells']) == 7
          assert p['decision_summary']['null_last_vs_first_abs_mean_difference_below_5pct'] is True
          for cell in p['cells']:
              for rep in ('first_nightly','last_nightly','check_level'):
                  assert cell['fits'][rep]['convergence_fraction'] >= 0.95
          print(json.dumps(p['decision_summary'], indent=2, sort_keys=True))
          PY

      - name: Persist downstream simulation result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin design/san-jacinto-scr-sigma-impact-v1
          mkdir -p results
          cp /tmp/san_jacinto_scr_sigma_downstream_simulation_v1.json \
             results/san_jacinto_scr_sigma_downstream_simulation_v1.json
          git add results/san_jacinto_scr_sigma_downstream_simulation_v1.json
          if git diff --cached --quiet; then
            echo "simulation result unchanged"
          else
            git commit -m "Add San Jacinto SCR sigma downstream simulation result"
            git push origin HEAD:design/san-jacinto-scr-sigma-impact-v1
          fi
