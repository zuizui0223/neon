name: san-jacinto-trap-sequence-audit-v1

on:
  push:
    branches:
      - analysis/trap-mediated-niche-v1
    paths:
      - analysis/audit_san_jacinto_within_night_sequence_v1.py
      - .github/workflows/san-jacinto-trap-sequence-audit-v1.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Download and verify public source
        run: |
          mkdir -p /tmp/sj
          curl -L --fail --retry 3 \
            https://ndownloader.figshare.com/files/33058799 \
            -o /tmp/sj/year_round_trap_data.csv
          echo "ec70b40fdcc66a3f9c07a3fda64b5eda06d251a899b9bc99cc5c5dff8c4ab301  /tmp/sj/year_round_trap_data.csv" | sha256sum -c -

      - name: Audit columns and within-night timestamp structure
        run: |
          python analysis/audit_san_jacinto_within_night_sequence_v1.py \
            --input /tmp/sj/year_round_trap_data.csv \
            --output /tmp/sj/within_night_sequence_audit_v1.json

      - name: Upload audit
        uses: actions/upload-artifact@v4
        with:
          name: san-jacinto-within-night-sequence-audit-v1
          path: /tmp/sj/within_night_sequence_audit_v1.json
          if-no-files-found: error
          retention-days: 30
