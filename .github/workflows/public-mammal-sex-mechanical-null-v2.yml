name: public-mammal-sex-mechanical-null-v2

on:
  push:
    branches:
      - design/public-mammal-sex-packing-v1
    paths:
      - analysis/mammal_spatial_packing_exact_v2.py
      - analysis/audit_sex_packing_mechanical_null_v2.py
      - tests/test_mammal_spatial_packing_exact_v2.py
      - tests/test_sex_packing_mechanical_null_v2.py
      - docs/superpowers/specs/2026-09-29-public-mammal-sex-packing-null-amendment.md
      - validation/public_mammal_sex_packing_v1/mechanical_null_v1_failure_receipt.json
      - .github/workflows/public-mammal-sex-mechanical-null-v2.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  exact-null:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: design/public-mammal-sex-packing-v1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install frozen numerical dependency
        run: python -m pip install numpy==2.1.1

      - name: Verify exact finite-population moments
        run: |
          python -m unittest \
            tests.test_mammal_spatial_packing_exact_v2 \
            tests.test_sex_packing_mechanical_null_v2 -v

      - name: Freeze exact-v2 mechanical audit
        run: |
          python - <<'PY'
          import importlib.util
          import json
          from pathlib import Path

          path=Path("analysis/audit_sex_packing_mechanical_null_v2.py")
          spec=importlib.util.spec_from_file_location("sexnullv2",path)
          module=importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          out=module.audit_standard_geometries()

          assert out["passes"] is True
          assert out["legacy_warning_threshold_abs_rho"] == 0.2
          assert out["ecological_effects_inspected"] is False
          assert out["ecological_model_fits"] == 0
          assert all(
              g["spearman_sex_ratio_vs_expected_delta"] == 0.0
              for g in out["geometries"]
          )

          target=Path("results/heteromyid_sex_packing_mechanical_null_v2.json")
          target.parent.mkdir(parents=True,exist_ok=True)
          target.write_text(
              json.dumps(out,indent=2,sort_keys=True)+"\n",
              encoding="utf-8",
          )
          print(json.dumps(out,indent=2,sort_keys=True))
          PY

      - name: Persist exact-v2 audit receipt
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/heteromyid_sex_packing_mechanical_null_v2.json
          if git diff --cached --quiet; then
            echo "exact-v2 audit unchanged"
          else
            git commit -m "Freeze heteromyid exact-v2 mechanical null audit"
            git push origin HEAD:design/public-mammal-sex-packing-v1
          fi

      - name: Upload exact-v2 audit
        uses: actions/upload-artifact@v4
        with:
          name: heteromyid-sex-packing-mechanical-null-v2
          path: results/heteromyid_sex_packing_mechanical_null_v2.json
          if-no-files-found: error
          retention-days: 30
