name: mammal-scale-validity-audit

on:
  push:
    branches:
      - audit/mammal-scale-validity-v1
    paths:
      - analysis/audit_mammal_scale_validity_v1.py
      - tests/test_mammal_scale_validity_audit.py
      - .github/workflows/mammal-scale-validity-audit.yml
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install audit dependency
        run: python -m pip install numpy==2.1.1
      - name: Run geometry unit tests
        run: python -m unittest tests.test_mammal_scale_validity_audit -v
      - name: Run metadata-only 27-site scale audit
        run: python analysis/audit_mammal_scale_validity_v1.py
      - name: Upload scale audit
        uses: actions/upload-artifact@v4
        with:
          name: mammal-scale-validity-audit-v1
          path: results/generated/mammal_scale_geometry_audit_v1.json
          if-no-files-found: error
          retention-days: 30
