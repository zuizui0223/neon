name: external-MOSA-effect-blind-identity-conflicts

on:
  push:
    branches:
      - design/multiscale-density-accommodation-v1
    paths:
      - "analysis/audit_mosa_effect_blind_identity_conflicts_v1.py"
      - "analysis/run_mosa_effect_blind_identity_conflicts_v1.py"
      - "tests/test_mosa_effect_blind_identity_conflicts_v1.py"
      - ".github/workflows/external-MOSA-effect-blind-identity-conflicts.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: external-mosa-effect-blind-identity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit-original-source:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify synthetic identity, SX and frozen-cohort safeguards
        run: |
          python -m unittest discover -s tests -p 'test_mosa_effect_blind_identity_conflicts_v1.py' -v
          python -m unittest discover -s tests -p 'test_mosa_frozen_conservative_mna_support_v1.py' -v
      - name: Run checksum-verified real MOSA audit with all spatial effects sealed
        run: python -m analysis.run_mosa_effect_blind_identity_conflicts_v1
      - name: Archive aggregate identity warning counts only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: external-MOSA-effect-blind-identity-conflicts-v1
          path: build/mosa_effect_blind_identity_conflicts_v1.json
          if-no-files-found: warn
          retention-days: 40
