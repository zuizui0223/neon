name: external-MOSA-authors-encounter-matrix-schema

on:
  push:
    branches:
      - design/multiscale-density-accommodation-v1
    paths:
      - "analysis/audit_mosa_encounter_matrix_schema_v1.py"
      - "tests/test_mosa_encounter_matrix_schema_v1.py"
      - ".github/workflows/external-MOSA-authors-encounter-matrix-schema.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  encounter-IDs:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test matrix header/row identity integrity without ecological effects
        run: python -m unittest discover -s tests -p 'test_mosa_encounter_matrix_schema_v1.py' -v
      - name: Verify published author encounter matrices by checksum and audit identity counts
        run: python -m analysis.audit_mosa_encounter_matrix_schema_v1
      - name: Archive identity-only result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: external-MOSA-authors-encounter-matrix-schema-v1
          path: build/mosa_author_encounter_identity_schema_v1.json
          if-no-files-found: warn
          retention-days: 45
