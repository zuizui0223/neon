name: external-MOSA-authors-ID-processing

on:
  push:
    branches:
      - design/multiscale-density-accommodation-v1
    paths:
      - "analysis/audit_mosa_published_identity_processing_v1.py"
      - "tests/test_mosa_published_identity_processing_v1.py"
      - ".github/workflows/external-MOSA-authors-ID-processing.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  author-ID-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test bounded evidence extraction
        run: python -m unittest discover -s tests -p 'test_mosa_published_identity_processing_v1.py' -v
      - name: Check authors RMarkdown and encounter source inventories by checksum
        run: python -m analysis.audit_mosa_published_identity_processing_v1
      - name: Archive authors' ID evidence without animal-level source records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: external-MOSA-authors-ID-processing-v1
          path: build/mosa_published_identity_processing_v1.json
          if-no-files-found: warn
          retention-days: 45
