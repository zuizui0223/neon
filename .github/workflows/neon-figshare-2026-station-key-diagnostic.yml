name: neon-figshare-2026-station-night-original-key-diagnostic
on:
  push:
    branches:
      - design/multiscale-density-accommodation-v1
    paths:
      - 'analysis/diagnose_neon_figshare_2026_missing_station_night_keys_v1.py'
      - '.github/workflows/neon-figshare-2026-station-key-diagnostic.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'analysis/diagnose_neon_figshare_2026_missing_station_night_keys_v1.py'
      - '.github/workflows/neon-figshare-2026-station-key-diagnostic.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: neon-original-figshare-2026-station-key-diagnostic-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source-only-station-night-key-missingness-not-biology:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify exact Figshare originals and diagnose ONLY station-night source field missingness
        run: python -m analysis.diagnose_neon_figshare_2026_missing_station_night_keys_v1
      - name: Archive anonymized original station key schema diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neon-figshare-2026-original-station-key-missingness-only
          path: build/neon_figshare_2026_station_key_source_diagnosis_v1.json
          if-no-files-found: warn
          retention-days: 45
