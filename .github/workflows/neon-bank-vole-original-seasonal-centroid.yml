name: neon-bank-vole-original-seasonal-centroid-ecology
on:
  push:
    branches:
      - design/multiscale-density-accommodation-v1
    paths:
      - 'analysis/run_neon_external_bank_vole_centroid_v1.py'
      - 'tests/test_neon_external_bank_vole_centroid_v1.py'
      - 'docs/NEON_BANK_VOLE_SEASONAL_CENTROID_FROZEN_20261115.md'
      - '.github/workflows/neon-bank-vole-original-seasonal-centroid.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: neon-frozen-bank-vole-centroid-${{ github.ref }}
  cancel-in-progress: true
jobs:
  bank-vole-seasonal-centroid-external-ecology:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check original centroid and finite-capture reallocation arithmetic
        run: python -m unittest discover -s tests -p 'test_neon_external_bank_vole_centroid_v1.py' -v
      - name: Reverify original vole sources and execute frozen 51-individual factorial comparison
        run: python -m analysis.run_neon_external_bank_vole_centroid_v1
      - name: Archive aggregate field outcomes or structured STOP
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neon-bank-vole-seasonal-capture-centroid-source
          path: build/neon_bank_vole_individual_seasonal_centroid_20261115.json
          if-no-files-found: warn
          retention-days: 45
