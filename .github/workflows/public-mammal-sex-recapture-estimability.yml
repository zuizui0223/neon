name: public-mammal-sex-recapture-estimability

on:
  push:
    branches:
      - design/public-mammal-sex-packing-v1
    paths:
      - validation/public_mammal_sex_packing_v1/recapture_validation_lock_v1.json
      - docs/superpowers/specs/2026-09-29-heteromyid-sex-recapture-validation-lock.md
      - analysis/neon_sex_recapture_estimability_v1.py
      - tests/test_neon_sex_recapture_estimability.py
      - .github/workflows/public-mammal-sex-recapture-estimability.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  estimability:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v4
        with:
          ref: design/public-mammal-sex-packing-v1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install numerical dependency
        run: python -m pip install numpy==2.1.1

      - name: Verify recapture estimability contract
        run: |
          python -m unittest tests.test_neon_sex_recapture_estimability -v
          python - <<'PY'
          import json
          from pathlib import Path
          lock=json.loads(
              Path("validation/public_mammal_sex_packing_v1/recapture_validation_lock_v1.json").read_text()
          )
          assert lock["state"] == "frozen_before_sex_specific_recapture_displacement_effects"
          assert lock["sex_specific_movement_magnitudes_inspected"] is False
          assert lock["movement_effect_models_fit"] == 0
          PY

      - name: Require NEON token
        env:
          NEON_API_TOKEN: ${{ secrets.NEON_API_TOKEN }}
        run: |
          if [ -z "$NEON_API_TOKEN" ]; then
            echo "::error::NEON_API_TOKEN repository secret is required."
            exit 3
          fi

      - name: Audit all-site sex recapture estimability
        env:
          NEON_API_TOKEN: ${{ secrets.NEON_API_TOKEN }}
        run: |
          python analysis/neon_sex_recapture_estimability_v1.py \
            --output-dir results/generated/sex_recapture_estimability

      - name: Assert effect-blind recapture gate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(
              Path("results/generated/sex_recapture_estimability/heteromyid_sex_recapture_estimability_v1.json").read_text()
          )
          assert p["sex_specific_movement_magnitudes_inspected"] is False
          assert p["movement_effect_models_fit"] == 0
          assert p["gate"]["decision"] in {
              "authorize_sex_specific_recapture_displacement",
              "stop_recapture_validation_not_estimable",
          }
          print(json.dumps(p,indent=2,sort_keys=True))
          PY

      - name: Persist recapture estimability receipt
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin design/public-mammal-sex-packing-v1

          cp results/generated/sex_recapture_estimability/heteromyid_sex_recapture_estimability_v1.json \
             validation/public_mammal_sex_packing_v1/recapture_estimability_gate_v1.json

          git add validation/public_mammal_sex_packing_v1/recapture_estimability_gate_v1.json
          if git diff --cached --quiet; then
            echo "recapture estimability unchanged"
          else
            git commit -m "Freeze sex recapture estimability gate"
            git push origin HEAD:design/public-mammal-sex-packing-v1
          fi

      - name: Upload recapture estimability events
        uses: actions/upload-artifact@v4
        with:
          name: heteromyid-sex-recapture-estimability-v1
          path: |
            results/generated/sex_recapture_estimability/heteromyid_sex_recapture_estimability_events_v1.csv
            results/generated/sex_recapture_estimability/heteromyid_sex_recapture_estimability_v1.json
          if-no-files-found: error
          retention-days: 30
