name: neon-figshare-2023-original-R-cover-risk-ontology
on:
  push:
    branches:
      - design/multiscale-density-accommodation-v1
    paths:
      - 'analysis/audit_neon_figshare_2023_original_R_treatment_code_v1.py'
      - '.github/workflows/neon-figshare-2023-original-R-risk-ontology.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'analysis/audit_neon_figshare_2023_original_R_treatment_code_v1.py'
      - '.github/workflows/neon-figshare-2023-original-R-risk-ontology.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: neon-figshare-2023-original-R-code-ontology-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checksum-verify-original-analysis-script-and-read-ontology-only:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify original MD5 and inspect limited source code lines about TREAT SITE_ID
        run: python -m analysis.audit_neon_figshare_2023_original_R_treatment_code_v1
      - name: Preserve source ontology receipt, no raw data or modeled effects
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neon-figshare-2023-original-R-methods-ontology
          path: build/neon_figshare_2023_original_R_risk_code_ontology_20261121.json
          if-no-files-found: warn
          retention-days: 45
