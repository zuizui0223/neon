name: NEON Pillay terminal recorded fate V19b
on:
  push:
    branches: [analysis/seasonal-seed-fate-stage-v1-20261125]
    paths:
      - '.github/workflows/neon-pillay-terminal-v19b.yml'
permissions:
  contents: read
jobs:
  terminal:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install openpyxl==3.1.5
      - run: python analysis/neon_pillay_terminal_v19b.py
      - uses: actions/upload-artifact@v4
        with:
          name: pillay-terminal-v19b
          path: pillay_terminal_v19b.json
          if-no-files-found: error
