name: san-jacinto-aliasing-cluster-robust-audit

on:
  push:
    branches:
      - design/san-jacinto-intranight-aliasing-v1
    paths:
      - results/san_jacinto_intranight_aliasing_result_v1.json
      - analysis/audit_san_jacinto_aliasing_cluster_robust_v1.py
      - tests/test_san_jacinto_aliasing_cluster_robust.py
      - .github/workflows/san-jacinto-aliasing-cluster-robust-audit.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: design/san-jacinto-intranight-aliasing-v1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install robustness dependency
        run: python -m pip install scipy==1.18.1

      - name: Verify cluster audit tests
        run: python -m unittest tests.test_san_jacinto_aliasing_cluster_robust -v

      - name: Run cluster-robust audit
        run: |
          python analysis/audit_san_jacinto_aliasing_cluster_robust_v1.py \
            --result results/san_jacinto_intranight_aliasing_result_v1.json \
            --cache data/cache/san_jacinto/year_round_trap_data.csv \
            --output /tmp/san_jacinto_aliasing_cluster_robust_v1.json

      - name: Require robustness to all clustering axes
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path("/tmp/san_jacinto_aliasing_cluster_robust_v1.json").read_text())
          assert p["primary_decision"] == "confirm_intranight_positional_aliasing_across_cricetids"
          assert p["both_species_robust_to_individual_grid_and_bout_clustering"] is True
          assert p["can_change_primary_decision"] is False
          print(json.dumps(p,indent=2,sort_keys=True))
          PY

      - name: Persist robustness receipt
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin design/san-jacinto-intranight-aliasing-v1
          cp /tmp/san_jacinto_aliasing_cluster_robust_v1.json \
             validation/san_jacinto_intranight_aliasing_v1/cluster_robust_audit_v1.json
          git add validation/san_jacinto_intranight_aliasing_v1/cluster_robust_audit_v1.json
          if git diff --cached --quiet; then
            echo "cluster audit unchanged"
          else
            git commit -m "Freeze cluster-robust aliasing audit"
            git push origin HEAD:design/san-jacinto-intranight-aliasing-v1
          fi
