name: NEON Merz station key diagnosis V7
on:
  push:
    branches: [analysis/seasonal-seed-fate-stage-v1-20261125]
    paths:
      - '.github/workflows/neon-merz-station-key-v7.yml'
permissions:
  contents: read
jobs:
  diagnosis:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - run: python3 analysis/audit_neon_merz_station_keys_v7.py
      - uses: actions/upload-artifact@v4
        with:
          name: merz-station-key-v7
          path: merz_station_key_diagnosis.json
          if-no-files-found: error
