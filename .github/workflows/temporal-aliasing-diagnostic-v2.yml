name: temporal-aliasing-diagnostic-v2

on:
  push:
    branches: [design/san-jacinto-scr-sigma-impact-v1]
    paths:
      - analysis/temporal_aliasing_diagnostic_v2.py
      - tests/test_temporal_aliasing_diagnostic_v2.py
      - docs/TEMPORAL_ALIASING_DIAGNOSTIC_V2.md
      - .github/workflows/temporal-aliasing-diagnostic-v2.yml
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: design/san-jacinto-scr-sigma-impact-v1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest tests.test_temporal_aliasing_diagnostic_v2 -v
