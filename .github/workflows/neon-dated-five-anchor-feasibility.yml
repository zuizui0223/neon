name: neon-dated-five-anchor-feasibility

on:
  push:
    branches:
      - design/multiscale-density-accommodation-v1
    paths:
      - "analysis/audit_neon_crossseason_genus_support_v1.py"
      - "analysis/audit_neon_dated_five_anchor_feasibility_v1.py"
      - "analysis/run_neon_dated_five_anchor_feasibility_v1.py"
      - "tests/test_neon_dated_five_anchor_feasibility_v1.py"
      - ".github/workflows/neon-dated-five-anchor-feasibility.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: neon-dated-five-anchor-${{ github.ref }}
  cancel-in-progress: true

jobs:
  historical-five-anchor-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      NEON_API_TOKEN: ${{ secrets.NEON_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify half-open historic date selection, privacy and 58-pair source identity
        run: |
          python -m unittest discover -s tests -p 'test_neon_dated_five_anchor_feasibility_v1.py' -v
          python -m unittest discover -s tests -p 'test_neon_dated_station_location_v1.py' -v
          python -m unittest discover -s tests -p 'test_neon_crossseason_genus_support_v1.py' -v
      - name: Require authorized RELEASE-2026 source data access
        run: test -n "$NEON_API_TOKEN"
      - name: Audit actual 1740 original capture-day×five-anchor historical location validity
        run: python -m analysis.run_neon_dated_five_anchor_feasibility_v1
      - name: Archive aggregate source date-historical coverage only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neon-dated-five-anchor-source-coverage-v1
          path: build/neon_dated_five_anchor_feasibility_v1.json
          if-no-files-found: warn
          retention-days: 40
