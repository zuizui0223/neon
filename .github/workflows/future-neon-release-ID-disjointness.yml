name: future-neon-release-ID-disjointness

on:
  push:
    branches:
      - design/multiscale-density-accommodation-v1
    paths:
      - "analysis/audit_future_neon_release_disjointness_v1.py"
      - "tests/test_future_neon_release_disjointness_v1.py"
      - ".github/workflows/future-neon-release-ID-disjointness.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  no-overlap:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      NEON_API_TOKEN: ${{ secrets.NEON_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify ID collision and fail-closed cases
        run: python -m unittest discover -s tests -p 'test_future_neon_release_disjointness_v1.py' -v
      - name: Require NEON public-data access
        run: test -n "$NEON_API_TOKEN"
      - name: Compare checksum-locked archived and provisional plot/night IDs
        run: python -m analysis.audit_future_neon_release_disjointness_v1
      - name: Archive identity boundary receipt, including STOP
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: future-neon-release-ID-disjointness-v1
          path: build/future_neon_frozen_release_disjointness_v1.json
          if-no-files-found: warn
          retention-days: 40
