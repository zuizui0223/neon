name: neon-prairie-vole-independent-contact-figshare-source
on:
  push:
    branches:
      - design/multiscale-density-accommodation-v1
    paths:
      - 'analysis/neon_figshare_prairie_vole_source_v1.py'
      - 'tests/test_neon_figshare_prairie_vole_source_v1.py'
      - 'docs/NEON_DIRECT_CONTACT_INDEPENDENT_SOURCE_20261115.md'
      - '.github/workflows/neon-prairie-vole-independent-contact-source.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: neon-prairie-vole-contact-source-${{ github.ref }}
  cancel-in-progress: true
jobs:
  public-independent-sensor-source-metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Synthetic tests for source role and public project identity
        run: python -m unittest discover -s tests -p 'test_neon_figshare_prairie_vole_source_v1.py' -v
      - name: Request public provider metadata only, never mouse ID or contact outcomes
        run: python -m analysis.neon_figshare_prairie_vole_source_v1
      - name: Archive read-only original public source metadata or explicit transport STOP
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neon-prairie-vole-independent-contact-metadata-source
          path: build/neon_prairie_vole_independent_contact_figshare_source_20261115.json
          if-no-files-found: warn
          retention-days: 45
