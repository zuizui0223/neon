name: scr-temporal-collapse-calibration

on:
  push:
    branches:
      - design/san-jacinto-scr-sigma-impact-v1
    paths:
      - analysis/scr_temporal_collapse_calibration_v1.R
      - .github/workflows/scr-temporal-collapse-calibration.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scr-temporal-collapse-calibration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  calibrate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: design/san-jacinto-scr-sigma-impact-v1
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::secr
            any::jsonlite
      - name: Calibrate repeated-check geometry
        run: |
          Rscript analysis/scr_temporal_collapse_calibration_v1.R \
            --replicates 50 \
            --seed 20261003 \
            --output-json /tmp/scr_temporal_collapse_calibration_v1.json
      - name: Verify guardrails
        run: |
          Rscript - <<'RS'
          library(jsonlite)
          z <- fromJSON("/tmp/scr_temporal_collapse_calibration_v1.json", simplifyVector=FALSE)
          stopifnot(identical(z$guardrails$empirical_sigma_effect_opened,FALSE))
          stopifnot(identical(z$guardrails$empirical_scr_stop_gate_relaxed,FALSE))
          RS
      - name: Persist calibration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin design/san-jacinto-scr-sigma-impact-v1
          mkdir -p results
          cp /tmp/scr_temporal_collapse_calibration_v1.json results/
          git add results/scr_temporal_collapse_calibration_v1.json
          if git diff --cached --quiet; then
            echo "calibration unchanged"
          else
            git commit -m "Calibrate SCR temporal-collapse geometry"
            git push origin HEAD:design/san-jacinto-scr-sigma-impact-v1
          fi
