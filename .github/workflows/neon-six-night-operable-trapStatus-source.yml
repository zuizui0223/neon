name: neon-six-night-operable-trapStatus-source

on:
  push:
    branches:
      - design/multiscale-density-accommodation-v1
    paths:
      - "analysis/neon_macro_6night_operable_trap_status_v1.py"
      - "analysis/run_neon_macro_6night_operable_source_v1.py"
      - "tests/test_neon_macro_6night_operable_trap_status_v1.py"
      - ".github/workflows/neon-six-night-operable-trapStatus-source.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: neon-six-night-operability-source-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frozen-original-source-operability:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NEON_API_TOKEN: ${{ secrets.NEON_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit test official trapStatus 4/5/6 versus not-set/disturbed/unknown
        run: |
          python -m unittest discover -s tests -p 'test_neon_macro_6night_operable_trap_status_v1.py' -v
          python -m unittest discover -s tests -p 'test_neon_exact_two_genus_source_v1.py' -v
      - name: Require original source access token
        run: test -n "$NEON_API_TOKEN"
      - name: Reconstruct original 158 pairs and record all-six-night true operable-status code support
        run: python -m analysis.run_neon_macro_6night_operable_source_v1
      - name: Preserve source-only aggregate outcome or STOP
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neon-six-night-actual-operable-status-source
          path: build/neon_macro_6night_operable_status456_source_v1.json
          if-no-files-found: warn
          retention-days: 45
