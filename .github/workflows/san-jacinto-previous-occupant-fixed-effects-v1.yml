name: san-jacinto-previous-occupant-fixed-effects-v1

on:
  push:
    branches:
      - analysis/trap-mediated-niche-v1
    paths:
      - analysis/san_jacinto_previous_occupant_fixed_effects_v1.R
      - docs/SAN_JACINTO_PREVIOUS_OCCUPANT_FIXED_EFFECTS_V1.md
      - .github/workflows/san-jacinto-previous-occupant-fixed-effects-v1.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyse:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::fixest
            any::jsonlite

      - name: Download and verify public source
        run: |
          mkdir -p /tmp/sj
          curl -L --fail --retry 3 \
            https://ndownloader.figshare.com/files/33058799 \
            -o /tmp/sj/year_round_trap_data.csv
          echo "ec70b40fdcc66a3f9c07a3fda64b5eda06d251a899b9bc99cc5c5dff8c4ab301  /tmp/sj/year_round_trap_data.csv" | sha256sum -c -

      - name: Fit previous-occupant fixed-effect models
        run: |
          Rscript analysis/san_jacinto_previous_occupant_fixed_effects_v1.R \
            /tmp/sj/year_round_trap_data.csv \
            /tmp/sj/previous_occupant_fixed_effects_v1.json

      - name: Print focal contrasts
        run: |
          python - <<'PY'
          import json
          p=json.load(open("/tmp/sj/previous_occupant_fixed_effects_v1.json"))
          print(json.dumps({
            "support":p["support"],
            "pooled":p["pooled_small_species_after_previous_group"],
            "focal":p["focal_previous_kangaroo_rat_contrasts"],
          },indent=2))
          PY

      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: san-jacinto-previous-occupant-fixed-effects-v1
          path: /tmp/sj/previous_occupant_fixed_effects_v1.json
          if-no-files-found: error
          retention-days: 30
