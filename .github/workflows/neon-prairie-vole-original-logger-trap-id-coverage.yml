name: neon-prairie-vole-original-logger-trap-id-coverage
on:
  push:
    branches:
      - design/multiscale-density-accommodation-v1
    paths:
      - 'analysis/run_neon_prairie_vole_figshare_identity_preflight_v1.py'
      - 'tests/test_neon_prairie_vole_figshare_identity_preflight_v1.py'
      - '.github/workflows/neon-prairie-vole-original-logger-trap-id-coverage.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: neon-original-logger-trap-id-${{ github.ref }}
  cancel-in-progress: true
jobs:
  exact-raw-source-namespace-time-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate exact tag namespace and original source date parser
        run: |
          python -m unittest discover -s tests -p 'test_neon_prairie_vole_figshare_identity_preflight_v1.py' -v
          python -m unittest discover -s tests -p 'test_neon_prairie_vole_figshare_file_headers_v1.py' -v
      - name: Verify six provider-MD5 original event data and source-only ID/date overlap
        run: python -m analysis.run_neon_prairie_vole_figshare_identity_preflight_v1
      - name: Archive only source-level ID namespace and date parsing counters
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neon-prairie-vole-direct-vs-trapped-ID-source
          path: build/neon_prairie_vole_original_contact_trap_source_join_20261115.json
          if-no-files-found: warn
          retention-days: 45
