name: neon-figshare-2026-individual-repeat-patch-source-only
on:
  push:
    branches:
      - design/multiscale-density-accommodation-v1
    paths:
      - 'analysis/audit_neon_figshare_2026_repeat_patch_visit_support_v1.py'
      - 'tests/test_neon_figshare_2026_repeat_patch_visit_support_v1.py'
      - 'docs/NEON_FIGSHARE_2026_PRIOR_PATCH_VISIT_SOURCE_GATE_20261122.md'
      - '.github/workflows/neon-figshare-2026-repeat-patch-source-only.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'analysis/audit_neon_figshare_2026_repeat_patch_visit_support_v1.py'
      - 'tests/test_neon_figshare_2026_repeat_patch_visit_support_v1.py'
      - 'docs/NEON_FIGSHARE_2026_PRIOR_PATCH_VISIT_SOURCE_GATE_20261122.md'
      - '.github/workflows/neon-figshare-2026-repeat-patch-source-only.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: neon-figshare-repeat-patch-source-${{ github.ref }}
  cancel-in-progress: true
jobs:
  original-source-individual-return-visits-no-learning-effects:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check synthetic visit ID, clock, returned PIT, alternatives and effect isolation
        run: python -m unittest discover -s tests -p 'test_neon_figshare_2026_repeat_patch_visit_support_v1.py' -v
      - name: Reverify five original Figshare SHA/MD5 CSVs, corrected source v2 GO and count only return-visit support
        run: python -m analysis.audit_neon_figshare_2026_repeat_patch_visit_support_v1
      - name: Archive source-only GO or explicit structural STOP
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neon-figshare-original-PIT-return-patch-source-only
          path: build/neon_figshare_2026_repeat_patch_visit_source_v1.json
          if-no-files-found: warn
          retention-days: 45
