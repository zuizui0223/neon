name: neon-exact-two-genus-uniform-ecology

on:
  push:
    branches:
      - design/multiscale-density-accommodation-v1
    paths:
      - "analysis/neon_exact_two_row_fixedmargin_v1.py"
      - "analysis/run_neon_exact_two_genus_ecology_v1.py"
      - "analysis/run_neon_two_genus_source_v1.py"
      - "tests/test_neon_exact_two_row_fixedmargin_v1.py"
      - "tests/test_neon_exact_two_ecology_gate_v1.py"
      - ".github/workflows/neon-exact-two-genus-uniform-ecology.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: neon-exact-two-genus-uniform-ecology-${{ github.ref }}
  cancel-in-progress: true

jobs:
  actual-unseen-two-genus-effects:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NEON_API_TOKEN: ${{ secrets.NEON_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Prove exact two-row uniform fixed-margin distribution and variance gate
        run: |
          python -m unittest discover -s tests -p 'test_neon_exact_two_row_fixedmargin_v1.py' -v
          python -m unittest discover -s tests -p 'test_neon_exact_two_ecology_gate_v1.py' -v
          python -m unittest discover -s tests -p 'test_neon_exact_two_genus_source_v1.py' -v
      - name: Require original checksum-verified NEON source token
        run: test -n "$NEON_API_TOKEN"
      - name: Open exploratory exact-two genus recurrence only after source and exact-null feasibility
        run: python -m analysis.run_neon_exact_two_genus_ecology_v1
      - name: Preserve complete aggregate biological or STOP receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neon-exact-two-genus-uniform-recurrence-v1
          path: build/neon_exact_two_genus_ecological_effect_v1.json
          if-no-files-found: warn
          retention-days: 45
