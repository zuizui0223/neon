name: multiscale-density-single-catch-null

on:
  push:
    branches:
      - design/multiscale-density-accommodation-v1
    paths:
      - "analysis/simulate_multiscale_density_single_catch_null_v1.py"
      - "tests/test_multiscale_density_single_catch_null_v1.py"
      - ".github/workflows/multiscale-density-single-catch-null.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  simulate:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependency
        run: python -m pip install numpy==2.1.1
      - name: Test single-catch null mechanics
        run: python -m unittest tests.test_multiscale_density_single_catch_null_v1 -v
      - name: Run broad single-catch null simulation
        run: python -m analysis.simulate_multiscale_density_single_catch_null_v1 --replicates 500
      - name: Upload null-simulation receipt
        uses: actions/upload-artifact@v4
        with:
          name: multiscale-density-single-catch-null-v1
          path: build/multiscale_density_single_catch_null_v1.json
          if-no-files-found: error
          retention-days: 30
