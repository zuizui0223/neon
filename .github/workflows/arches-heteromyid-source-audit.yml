name: arches-heteromyid-source-audit

on:
  push:
    branches:
      - design/arches-heteromyid-crossscale-source-v1
    paths:
      - docs/ARCHES_HETEROMYID_CROSSSCALE_SOURCE_AUDIT_V1.md
      - analysis/audit_arches_heteromyid_source_v1.py
      - tests/test_arches_heteromyid_source_audit.py
      - .github/workflows/arches-heteromyid-source-audit.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  source-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: design/arches-heteromyid-crossscale-source-v1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify source audit tests
        run: python -m unittest tests.test_arches_heteromyid_source_audit -v

      - name: Download frozen Dryad trapping files
        run: |
          set -euo pipefail
          mkdir -p data/cache/arches
          curl -L --fail --retry 3 --retry-delay 2             -A "Mozilla/5.0 arches-heteromyid-source-audit/1.0"             "https://datadryad.org/downloads/file_stream/21848"             -o "data/cache/arches/Rodent Trapping, Salt Valley.csv"
          curl -L --fail --retry 3 --retry-delay 2             -A "Mozilla/5.0 arches-heteromyid-source-audit/1.0"             "https://datadryad.org/downloads/file_stream/21850"             -o "data/cache/arches/Rodent Trapping, Willow Flats.csv"

          test "$(wc -c < 'data/cache/arches/Rodent Trapping, Salt Valley.csv')" -gt 10000
          test "$(wc -c < 'data/cache/arches/Rodent Trapping, Willow Flats.csv')" -gt 10000
          sha256sum data/cache/arches/*.csv

      - name: Audit schemas only
        run: |
          python analysis/audit_arches_heteromyid_source_v1.py             --salt "data/cache/arches/Rodent Trapping, Salt Valley.csv"             --willow "data/cache/arches/Rodent Trapping, Willow Flats.csv"             --output /tmp/arches_source_schema_audit_v1.json

      - name: Assert effect-blind source audit
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path("/tmp/arches_source_schema_audit_v1.json").read_text())
          assert p["species_specific_counts_inspected"] is False
          assert p["sex_specific_counts_inspected"] is False
          assert p["movement_distances_computed"] is False
          assert p["packing_effects_computed"] is False
          assert p["ecological_effect_models_fit"] == 0
          print(json.dumps({
              "both_site_files_structurally_adequate":p["both_site_files_structurally_adequate"],
              "sources":[{
                  "site_context":x["site_context"],
                  "sha256":x["sha256"],
                  "data_row_count":x["data_row_count"],
                  "columns":x["columns"],
                  "structural_columns":x["structural_columns"],
              } for x in p["sources"]],
          },indent=2,sort_keys=True))
          PY

      - name: Persist schema receipt
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin design/arches-heteromyid-crossscale-source-v1
          mkdir -p validation/arches_heteromyid_crossscale_v1
          cp /tmp/arches_source_schema_audit_v1.json              validation/arches_heteromyid_crossscale_v1/source_schema_audit_v1.json
          git add validation/arches_heteromyid_crossscale_v1/source_schema_audit_v1.json
          if git diff --cached --quiet; then
            echo "schema receipt unchanged"
          else
            git commit -m "Freeze Arches heteromyid source schema audit"
            git push origin HEAD:design/arches-heteromyid-crossscale-source-v1
          fi
