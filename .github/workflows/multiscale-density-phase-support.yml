name: multiscale-density-phase-support

on:
  push:
    branches:
      - design/multiscale-density-accommodation-v1
    paths:
      - "analysis/audit_multiscale_density_phase_support_v1.py"
      - "tests/test_multiscale_density_phase_support_v1.py"
      - "docs/MULTISCALE_DENSITY_PHASE_SUPPORT_CONTRACT_V1.md"
      - ".github/workflows/multiscale-density-phase-support.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phase-support:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      NEON_API_TOKEN: ${{ secrets.NEON_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate pure synthetic chronology support
        run: python -m unittest discover -s tests -p 'test_multiscale_density_phase_support_v1.py' -v
      - name: Require access token
        run: test -n "$NEON_API_TOKEN"
      - name: Structural RELEASE-2026 phase audit only
        run: python -m analysis.audit_multiscale_density_phase_support_v1
      - name: Archive support receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: multiscale-density-phase-support-v1
          path: build/multiscale_density_phase_support_v1.json
          if-no-files-found: warn
          retention-days: 30
