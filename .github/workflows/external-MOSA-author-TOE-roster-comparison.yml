name: external-MOSA-author-TOE-roster-comparison

on:
  push:
    branches:
      - design/multiscale-density-accommodation-v1
    paths:
      - "analysis/audit_mosa_encounter_toe_reconciliation_v1.py"
      - "tests/test_mosa_encounter_toe_reconciliation_v1.py"
      - ".github/workflows/external-MOSA-author-TOE-roster-comparison.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  toe-roster:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test author matrix row ID reconciliation not presuming row equals animal
        run: python -m unittest discover -s tests -p 'test_mosa_encounter_toe_reconciliation_v1.py' -v
      - name: Verify raw and author archive checksums then compare target species TOE roster
        run: python -m analysis.audit_mosa_encounter_toe_reconciliation_v1
      - name: Archive no-effect published individual identity comparison
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: external-MOSA-author-TOE-roster-comparison-v1
          path: build/mosa_raw_to_author_TOE_identity_roster_v1.json
          if-no-files-found: warn
          retention-days: 45
