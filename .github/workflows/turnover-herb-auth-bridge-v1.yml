name: turnover-herb-source-auth-bridge-v1
on:
  push:
    branches: [ops/turnover-herb-source-auth-20261114]
    paths: [.github/workflows/turnover-herb-auth-bridge-v1.yml]
  pull_request:
    paths: [.github/workflows/turnover-herb-auth-bridge-v1.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: turnover-herb-source-auth-bridge-v1
  cancel-in-progress: false
jobs:
  metadata-only:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Verify existing credential only within this repository and query fixed metadata
        env:
          NEON_API_TOKEN: ${{ secrets.NEON_API_TOKEN }}
        run: |
          python3 - <<'PY'
          import os,json,hashlib,urllib.request,urllib.error
          from pathlib import Path
          from urllib.parse import urlsplit
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,req,fp,code,msg,headers,newurl):
                  raise urllib.error.HTTPError(req.full_url,code,'redirect refused for credential safety',headers,fp)
          opener=urllib.request.build_opener(NoRedirect)
          def selected(files,prod):
              names=[str(f.get('name') or '').split('/')[-1] for f in files]
              required=('hbp_perbout','hbp_massdata') if prod=='DP1.10023.001' else ('div_1m2data',)
              return sorted(n for n in names if any(t in n.lower() for t in required)), [t for t in required if not any(t in n.lower() for n in names)]
          # Source-parser fixtures run before reading the credential.
          assert selected([{'name':'a.hbp_perbout.csv'},{'name':'a.hbp_massdata.csv'}],'DP1.10023.001')[1]==[]
          assert selected([{'name':'a.div_10m2data.csv'}],'DP1.10058.001')[1]==['div_1m2data']
          print('PARSER_FIXTURES_PASS')
          report={'version':'v1','purpose':'turnover PR41 source access only; unrelated mammal programme unchanged',
                  'credential_repository':'zuizui0223/neon','secret_value_exported':False,
                  'release':'RELEASE-2026','measured_rows_downloaded':False,'requests':[]}
          token=os.environ.get('NEON_API_TOKEN','')
          if not token:
              report['status']='AUTH_HOLD_EXISTING_REPOSITORY_SECRET_NOT_PRESENT'
          else:
              fixed=[('ABBY','2024-07','D16'),('BART','2022-07','D01'),('BLAN','2024-05','D02'),('CPER','2022-11','D10')]
              stop=False
              for site,month,domain in fixed:
                  for prod in ('DP1.10023.001','DP1.10058.001'):
                      url=f'https://data.neonscience.org/api/v0/data/{prod}/{site}/{month}?release=RELEASE-2026'
                      assert urlsplit(url).hostname=='data.neonscience.org'
                      row={'site':site,'month':month,'domain':domain,'product':prod}
                      req=urllib.request.Request(url,headers={'X-API-TOKEN':token,'Accept':'application/json','User-Agent':'turnover-authorized-source-bridge/1.0'})
                      try:
                          with opener.open(req,timeout=50) as response:
                              raw=response.read(12000001)
                              code=response.status
                          if len(raw)>12000000: raise ValueError('metadata oversized')
                          obj=json.loads(raw).get('data',{})
                          files=obj.get('files')
                          if not isinstance(files,list):raise ValueError('missing file list')
                          names,missing=selected(files,prod)
                          row.update(http_status=code,status='SOURCE_MANIFEST_PASS' if not missing else 'SOURCE_TABLES_HOLD',
                                     file_count=len(files),required_tables_missing=missing,table_file_names=names,
                                     metadata_sha256=hashlib.sha256(raw).hexdigest())
                      except urllib.error.HTTPError as error:
                          row.update(status='AUTH_OR_HTTP_HOLD',http_status=error.code)
                          if error.code in (401,403):stop=True
                      except (ValueError,TimeoutError,urllib.error.URLError) as error:
                          row.update(status='FORMAT_OR_TRANSPORT_HOLD',error_class=type(error).__name__)
                      report['requests'].append(row)
                      print('HERB_SOURCE_REQUEST',json.dumps(row,sort_keys=True))
                      if stop:break
                  if stop:break
              success=len(report['requests'])==8 and all(x['status']=='SOURCE_MANIFEST_PASS' for x in report['requests'])
              report['status']='AUTHENTICATED_FOUR_DOMAIN_MANIFEST_PASS' if success else 'SOURCE_ACCESS_OR_TABLE_HOLD'
          Path('turnover_herb_source_access_v1.json').write_text(json.dumps(report,indent=2,sort_keys=True)+'\n')
          print('HERB_SOURCE_BRIDGE_SUMMARY',json.dumps(report,sort_keys=True))
          # Access HOLD is retained as a result; a green job does not mean source PASS.
          PY
      - name: Preserve sanitized manifest, never token or signed download URLs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: turnover-herb-source-auth-bridge-v1
          path: turnover_herb_source_access_v1.json
          if-no-files-found: error
          retention-days: 30
