name: san-jacinto-stage3-denominator-audit
on:
  push:
    branches: [ecology/san-jacinto-transition-niche-v1]
    paths:
      - analysis/audit_san_jacinto_stage3_two_units_v1.py
      - .github/workflows/san-jacinto-stage3-denominator-audit.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ecology/san-jacinto-transition-niche-v1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python analysis/audit_san_jacinto_stage3_two_units_v1.py
      - name: Persist audit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin ecology/san-jacinto-transition-niche-v1
          git add results/san_jacinto_stage3_two_unit_denominator_audit_v1.json
          if git diff --cached --quiet; then
            echo unchanged
          else
            git commit -m "Audit two low-richness published units"
            git push origin HEAD:ecology/san-jacinto-transition-niche-v1
          fi
