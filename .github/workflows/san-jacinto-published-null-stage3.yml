name: san-jacinto-published-null-stage3

on:
  push:
    branches:
      - ecology/san-jacinto-transition-niche-v1
    paths:
      - .github/workflows/san-jacinto-published-null-stage3.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: san-jacinto-published-null-stage3-${{ github.ref }}
  cancel-in-progress: true

jobs:
  closed:
    runs-on: ubuntu-latest
    steps:
      - name: Stage 3 is closed
        run: |
          echo "Stage 3 exact 32-unit reproduction is closed."
          echo "The deposited public data contain only two focal species in grid 3 winter and grid 7 winter,"
          echo "whereas the publication reports 3-6 species in each of 32 matrices."
          echo "Use the separately frozen public-data Stage 4 route; do not reinterpret Stage 3."
# closed workflow refresh: 2026-10-05
