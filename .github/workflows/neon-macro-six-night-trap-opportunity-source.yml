name: neon-macro-six-night-trap-opportunity-source

on:
  push:
    branches:
      - design/multiscale-density-accommodation-v1
    paths:
      - "analysis/neon_macro_six_night_effort_v1.py"
      - "analysis/run_neon_macro_six_night_effort_source_v1.py"
      - "analysis/run_neon_two_genus_source_v1.py"
      - "tests/test_neon_macro_six_night_effort_v1.py"
      - ".github/workflows/neon-macro-six-night-trap-opportunity-source.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: neon-macro-six-night-trap-opportunity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-only-same-trap-effort:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NEON_API_TOKEN: ${{ secrets.NEON_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test six original trapping-night opportunity intersections without ecological overlap
        run: |
          python -m unittest discover -s tests -p 'test_neon_macro_six_night_effort_v1.py' -v
          python -m unittest discover -s tests -p 'test_neon_exact_two_genus_source_v1.py' -v
      - name: Require original RELEASE-2026 source authorization
        run: test -n "$NEON_API_TOKEN"
      - name: Rebuild exact original 158 season pairs and count shared recorded station opportunities
        run: python -m analysis.run_neon_macro_six_night_effort_source_v1
      - name: Archive only source safety, coverage and honest STOP
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neon-macro-six-night-recorded-trap-source-v1
          path: build/neon_macro_six_night_effort_source_v1.json
          if-no-files-found: warn
          retention-days: 45
