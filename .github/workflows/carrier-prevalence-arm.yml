name: carrier-prevalence-arm-response

on:
  push:
    branches:
      - analysis/carrier-prevalence-response-v1
    paths:
      - validation/carrier_prevalence_mechanism_v1/fresh_roster_lock_v1.json
      - .github/workflows/carrier-prevalence-arm.yml

permissions:
  contents: write

jobs:
  arm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: analysis/carrier-prevalence-response-v1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate frozen response protocol and authorization
        run: python analysis/arm_carrier_prevalence_response_v1.py
      - name: Persist response protocol and authorization
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add validation/carrier_prevalence_mechanism_v1/response_protocol_v1.json
          git add validation/carrier_prevalence_mechanism_v1/response_authorization_v1.json
          if git diff --cached --quiet; then
            echo "response already armed"
          else
            git commit -m "Arm once-only fresh carrier prevalence response"
            git push origin HEAD:analysis/carrier-prevalence-response-v1
          fi
