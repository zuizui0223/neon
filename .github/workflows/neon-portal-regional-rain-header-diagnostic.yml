name: neon-portal-regional-weather-original-header-diagnostic
on:
  push:
    branches:
      - design/multiscale-density-accommodation-v1
    paths:
      - 'analysis/diagnose_portal_regional_weather_schema_v1.py'
      - '.github/workflows/neon-portal-regional-rain-header-diagnostic.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'analysis/diagnose_portal_regional_weather_schema_v1.py'
      - '.github/workflows/neon-portal-regional-rain-header-diagnostic.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: neon-original-region-rain-header-only-${{ github.ref }}
  cancel-in-progress: true
jobs:
  original-GHCN-header-not-rainfall:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Hash-verify original weather and print header only
        run: python -m analysis.diagnose_portal_regional_weather_schema_v1
      - name: Archive no-value schema receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neon-portal-region-rain-headers-not-rain-values
          path: build/neon_portal_region_rain_schema_diagnosis_20261121.json
          if-no-files-found: warn
          retention-days: 45
