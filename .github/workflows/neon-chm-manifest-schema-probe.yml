name: neon-chm-manifest-schema-probe
on:
  push:
    branches: [design/multiscale-density-accommodation-v1]
    paths: ['.github/workflows/neon-chm-manifest-schema-probe.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  schema-only:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      NEON_API_TOKEN: ${{ secrets.NEON_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install parser dependencies
        run: python -m pip install numpy==2.1.1 rasterio==1.4.3
      - name: Inspect official tutorial site AOP query schema only
        run: |
          python - <<'PY'
          import os,json
          from collections import Counter
          from pathlib import Path
          from analysis.run_neon_habitat_source_link_v1 import _request_json,QUERY_URL,TOKEN_ENV,digest
          from analysis.neon_e5_chm_pilot_v1 import chm_manifest,tile_lower_left
          token=os.environ[TOKEN_ENV]
          p=_request_json(QUERY_URL,token=token,body={'productCode':'DP3.30015.001','siteCodes':['WREF'],'startDateMonth':'2024-01','endDateMonth':'2024-12','release':'RELEASE-2026','package':'basic','includeProvisional':False})
          data=p.get('data',{}); blocks=data.get('releases',[])
          pk=[];fs=[]
          for b in blocks:
              for q in b.get('packages',[]):
                  pk.append({'keys':sorted(q),'month_type':type(q.get('month')).__name__,'month_value':q.get('month'),'packageType':q.get('packageType'),'files':len(q.get('files',[]))})
                  for f in q.get('files',[]):
                      if tile_lower_left(f.get('name')) is not None:
                          fs.append({'keys':sorted(f),'size_type':type(f.get('size')).__name__,'md5_type':type(f.get('md5')).__name__,'md5_length':len(str(f.get('md5') or '')),'url_https':str(f.get('url','')).startswith('https://')})
          try:
              parsed=chm_manifest(p,'WREF',2024)
              result={'status':'PARSER_ACCEPTED','tiles':len(parsed)}
          except ValueError as e:
              result={'status':'PARSER_REJECTED','safe_reason':str(e)}
          out={'schema':'neon.chm.schema_probe.v1','source':'official NEON tutorial site/year, not biological response selection','data_keys':sorted(data),'release_blocks':[{'keys':sorted(b),'release_value':b.get('release')} for b in blocks],'package_descriptions':pk,'CHM_field_shape_counts':[{'shape':json.loads(k),'count':n} for k,n in Counter(json.dumps(f,sort_keys=True) for f in fs).items()],'parser':result,'canonical_payload_sha256':digest(p),'pixels_opened':False,'source_urls_or_file_names_exported':False}
          Path('build').mkdir(exist_ok=True)
          Path('build/neon_chm_schema_probe.json').write_text(json.dumps(out,indent=2)+'\n')
          print(json.dumps(out,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: neon-chm-schema-only-probe
          path: build/neon_chm_schema_probe.json
          retention-days: 30
