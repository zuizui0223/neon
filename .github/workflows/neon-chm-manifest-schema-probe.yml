name: neon-chm-manifest-schema-probe
on:
  push:
    branches: [design/multiscale-density-accommodation-v1]
    paths: ['.github/workflows/neon-chm-manifest-schema-probe.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  schema-only:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      NEON_API_TOKEN: ${{ secrets.NEON_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install parser dependencies
        run: python -m pip install numpy==2.1.1 rasterio==1.4.3
      - name: Inspect NEON official advertised monthly AOP endpoint only
        run: |
          python - <<'PY'
          import os,json
          from collections import Counter
          import re,base64,binascii
          from pathlib import Path
          from urllib.parse import urlparse
          from analysis.run_neon_habitat_source_link_v1 import _request_json,TOKEN_ENV,digest,BASE
          from analysis.neon_e5_chm_pilot_v1 import tile_lower_left
          token=os.environ[TOKEN_ENV]
          product=_request_json(BASE+'products/DP3.30015.001?release=RELEASE-2026',token=token)
          site=next(r for r in product['data']['siteCodes'] if r['siteCode']=='WREF')
          month=max(m for m in site['availableMonths'] if m[:4]<='2024')
          links=[u for u in site['availableDataUrls'] if urlparse(u).path.rstrip('/').endswith('/'+month)]
          if len(links)!=1 or urlparse(links[0]).hostname!='data.neonscience.org':raise ValueError('unambiguous official monthly URL required')
          p=_request_json(links[0],token=token)
          data=p.get('data',{}); fs=[]
          for f in data.get('files',[]):
              if tile_lower_left(f.get('name')) is not None:
                  def checksum_shape(value):
                      if value is None:return {'type':'NoneType','length':0}
                      text=str(value).strip()
                      try:
                          decoded=base64.b64decode(text,validate=True)
                          base64_length=len(decoded)
                      except (ValueError,binascii.Error):base64_length=None
                      return {'type':type(value).__name__,'length':len(text),
                              'decimal_digits':text.isdecimal(),
                              'is_hex8':bool(re.fullmatch(r'(?:0x)?[0-9a-fA-F]{8}',text)),
                              'base64_length':base64_length,
                              'contains_colon':':' in text}
                  fs.append({'keys':sorted(f),'size_type':type(f.get('size')).__name__,'md5_type':type(f.get('md5')).__name__,'md5_length':len(str(f.get('md5') or '')),'url_https':str(f.get('url','')).startswith('https://'),'crc32':checksum_shape(f.get('crc32')),'crc32c':checksum_shape(f.get('crc32c'))})
          out={'schema':'neon.chm.monthly_schema_probe.v1','source':'official tutorial site; latest advertised released-year month; no biological selection','data_keys':sorted(data),'declared_release':data.get('release'),'advertised_month':month,'returned_month':data.get('month'),'source_file_count':len(data.get('files',[])),'CHM_field_shape_counts':[{'shape':json.loads(k),'count':n} for k,n in Counter(json.dumps(f,sort_keys=True) for f in fs).items()],'canonical_payload_sha256':digest(p),'pixels_opened':False,'source_urls_or_file_names_exported':False}
          Path('build').mkdir(exist_ok=True)
          Path('build/neon_chm_schema_probe.json').write_text(json.dumps(out,indent=2)+'\n')
          print(json.dumps(out,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: neon-chm-schema-only-probe
          path: build/neon_chm_schema_probe.json
          retention-days: 30
