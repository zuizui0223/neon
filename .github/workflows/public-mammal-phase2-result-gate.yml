name: public-mammal-phase2-result-gate

on:
  push:
    branches:
      - design/public-mammal-space-use-v1
    paths:
      - validation/public_mammal_space_use_v1/phase2_result_artifacts_v1.json
      - analysis/audit_packing_n_independence_v1.py
      - analysis/freeze_public_mammal_phase2_results_v1.py
      - tests/test_packing_n_independence.py
      - tests/test_public_mammal_phase2_result_gate.py
      - tests/test_public_mammal_phase2_result_workflow.py
      - .github/workflows/public-mammal-phase2-result-gate.yml
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  freeze-result:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: design/public-mammal-space-use-v1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install result-gate dependency
        run: python -m pip install numpy==2.1.1

      - name: Verify frozen Phase-2 result artifact metadata
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request
          from pathlib import Path

          frozen=json.loads(
              Path("validation/public_mammal_space_use_v1/phase2_result_artifacts_v1.json")
              .read_text()
          )
          token=os.environ["GITHUB_TOKEN"]
          repo=os.environ["REPOSITORY"]
          for label in ("portal","neon","recapture"):
              expected=frozen[label]
              url=f"https://api.github.com/repos/{repo}/actions/artifacts/{expected['artifact_id']}"
              req=urllib.request.Request(
                  url,
                  headers={
                      "Authorization":f"Bearer {token}",
                      "Accept":"application/vnd.github+json",
                      "X-GitHub-Api-Version":"2022-11-28",
                  },
              )
              with urllib.request.urlopen(req,timeout=60) as response:
                  actual=json.loads(response.read().decode("utf-8"))
              run=actual.get("workflow_run") or {}
              checks={
                  "name":actual.get("name")==expected["name"],
                  "digest":actual.get("digest")==expected["digest"],
                  "workflow_run_id":run.get("id")==expected["workflow_run_id"],
                  "workflow_head_sha":run.get("head_sha")==expected["workflow_head_sha"],
                  "not_expired":not bool(actual.get("expired",False)),
              }
              if not all(checks.values()):
                  raise RuntimeError(f"{label} artifact drift: {checks}")
              print(label, json.dumps(checks,sort_keys=True))
          PY

      - name: Download frozen Portal Phase-2 results
        uses: actions/download-artifact@v4
        with:
          name: public-mammal-phase2-portal-v1
          path: results/generated/phase2_result_inputs/portal
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 36328080321

      - name: Download frozen NEON Phase-2 results
        uses: actions/download-artifact@v4
        with:
          name: public-mammal-phase2-neon-myodes-v1
          path: results/generated/phase2_result_inputs/neon
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 36367773226

      - name: Download frozen recapture validation result
        uses: actions/download-artifact@v4
        with:
          name: public-mammal-phase2-recapture-v1
          path: results/generated/phase2_result_inputs/recapture
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 36328869087

      - name: Verify result-gate contracts
        run: |
          python -m unittest             tests.test_packing_n_independence             tests.test_public_mammal_phase2_result_gate             tests.test_public_mammal_phase2_result_workflow -v

      - name: Run Packing_z mechanical-N audit
        run: python analysis/audit_packing_n_independence_v1.py

      - name: Freeze Phase-2 ecological result gate
        run: |
          python analysis/freeze_public_mammal_phase2_results_v1.py             --portal-primary results/generated/phase2_result_inputs/portal/results/generated/portal_cpen_phase2_primary_v1.json             --portal-sensitivity results/generated/phase2_result_inputs/portal/results/generated/portal_cpen_phase2_sensitivity_v1.json             --neon-primary results/generated/phase2_result_inputs/neon/results/generated/neon_myodes_phase2_primary_v1.json             --neon-secondary results/generated/phase2_result_inputs/neon/results/generated/neon_secondary_habitat_phase2_v1.json             --neon-context results/generated/phase2_result_inputs/neon/results/generated/neon_phase2_context_sensitivity_v1.json             --recapture-validation results/generated/phase2_result_inputs/recapture/neon_recapture_validation_phase2_v1.json             --packing-n-audit results/generated/packing_n_independence_v1.json             --source-artifacts validation/public_mammal_space_use_v1/phase2_result_artifacts_v1.json             --output-json results/public_mammal_phase2_summary_v1.json             --output-gate validation/public_mammal_space_use_v1/phase2_result_gate_v1.json             --output-md docs/PUBLIC_MAMMAL_PHASE2_RESULT_V1.md

      - name: Persist frozen Phase-2 result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/public_mammal_phase2_summary_v1.json
          git add validation/public_mammal_space_use_v1/phase2_result_gate_v1.json
          git add docs/PUBLIC_MAMMAL_PHASE2_RESULT_V1.md
          if git diff --cached --quiet; then
            echo "Phase-2 result gate unchanged"
          else
            git commit -m "Freeze public mammal Phase-2 ecological result"
            git push origin HEAD:design/public-mammal-space-use-v1
          fi

      - name: Upload Phase-2 result gate artifact
        uses: actions/upload-artifact@v4
        with:
          name: public-mammal-phase2-result-gate-v1
          path: |
            results/public_mammal_phase2_summary_v1.json
            validation/public_mammal_space_use_v1/phase2_result_gate_v1.json
            docs/PUBLIC_MAMMAL_PHASE2_RESULT_V1.md
            results/generated/packing_n_independence_v1.json
          if-no-files-found: error
          retention-days: 90
