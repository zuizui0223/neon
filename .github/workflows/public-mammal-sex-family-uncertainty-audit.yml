name: public-mammal-sex-family-uncertainty-audit

on:
  push:
    branches:
      - design/public-mammal-sex-packing-v1
    paths:
      - analysis/audit_sex_packing_family_uncertainty_v1.py
      - tests/test_sex_packing_family_uncertainty.py
      - .github/workflows/public-mammal-sex-family-uncertainty-audit.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          ref: design/public-mammal-sex-packing-v1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependency
        run: python -m pip install scipy==1.18.1

      - name: Test family uncertainty propagation
        run: |
          python -m unittest tests.test_sex_packing_family_uncertainty -v

      - name: Run frozen-result uncertainty audit
        run: |
          python analysis/audit_sex_packing_family_uncertainty_v1.py \
            --packing results/heteromyid_sex_packing_phase3_summary_v1.json \
            --recapture results/heteromyid_sex_recapture_effect_v1.json \
            --output /tmp/heteromyid_sex_packing_family_uncertainty_audit_v1.json

      - name: Validate rulings
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(
              Path("/tmp/heteromyid_sex_packing_family_uncertainty_audit_v1.json").read_text()
          )
          assert p["rulings"]["phase3_primary_decision_changes"] is False
          assert p["rulings"]["recapture_primary_decision_changes"] is False
          assert p["rulings"]["n5_previous_interval_supported"] is False
          assert p["recapture"]["sensitivity_n5"]["ci95_low"] < 0
          assert p["recapture"]["sensitivity_n5"]["ci95_high"] > 0
          print(json.dumps(p,indent=2,sort_keys=True))
          PY

      - name: Persist uncertainty audit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin design/public-mammal-sex-packing-v1
          cp /tmp/heteromyid_sex_packing_family_uncertainty_audit_v1.json \
             validation/public_mammal_sex_packing_v1/family_uncertainty_audit_v1.json
          git add validation/public_mammal_sex_packing_v1/family_uncertainty_audit_v1.json
          if git diff --cached --quiet; then
            echo "uncertainty audit unchanged"
          else
            git commit -m "Freeze family-level uncertainty audit"
            git push origin HEAD:design/public-mammal-sex-packing-v1
          fi
