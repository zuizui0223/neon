name: neon-poland-calendar-session-v2
on:
  push:
    branches: [design/multiscale-density-accommodation-v1]
    paths:
      - 'analysis/run_neon_poland_calendar_session_v2.py'
      - 'tests/test_neon_poland_calendar_session_v2.py'
      - '.github/workflows/neon-poland-calendar-session-v2.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-calendar-diagnosis:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p 'test_neon_poland_calendar_session_v2.py' -v
      - run: python -m analysis.run_neon_poland_calendar_session_v2
      - uses: actions/upload-artifact@v4
        with:
          name: neon-poland-calendar-session-v2
          path: build/neon_poland_calendar_session_v2_20261125.json
          if-no-files-found: error
