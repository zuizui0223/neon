name: future-neon-provisional-bout-structure

on:
  push:
    branches:
      - design/multiscale-density-accommodation-v1
    paths:
      - "analysis/audit_future_neon_plot_structure_v1.py"
      - "tests/test_future_neon_plot_structure_v1.py"
      - ".github/workflows/future-neon-provisional-bout-structure.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  structure:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEON_API_TOKEN: ${{ secrets.NEON_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test strict provisional-only bout selection
        run: python -m unittest discover -s tests -p 'test_future_neon_plot_structure_v1.py' -v
      - name: Verify NEON access
        run: test -n "$NEON_API_TOKEN"
      - name: Audit prospective three-night bouts without reading captures
        run: python -m analysis.audit_future_neon_plot_structure_v1
      - name: Archive effect-blind structural receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: future-neon-provisional-bout-structure-v1
          path: build/future_neon_mammal_plot_structure_v1.json
          if-no-files-found: warn
          retention-days: 35
