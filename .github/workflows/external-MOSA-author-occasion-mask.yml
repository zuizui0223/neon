name: external-MOSA-author-occasion-mask

on:
  push:
    branches:
      - design/multiscale-density-accommodation-v1
    paths:
      - "analysis/audit_mosa_author_occasion_mask_v1.py"
      - "tests/test_mosa_author_occasion_mask_v1.py"
      - ".github/workflows/external-MOSA-author-occasion-mask.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: external-mosa-author-occasion-${{ github.ref }}
  cancel-in-progress: true

jobs:
  exact-author-occasion:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify official three-night calendar and missing-ID classification fixtures
        run: python -m unittest discover -s tests -p 'test_mosa_author_occasion_mask_v1.py' -v
      - name: Compare missing MN tags against authors official sessions with source MD5 verification
        run: python -m analysis.audit_mosa_author_occasion_mask_v1
      - name: Archive effect-blind official author occasion receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: external-MOSA-author-occasion-mask-v1
          path: build/mosa_author_occasion_mask_v1.json
          if-no-files-found: warn
          retention-days: 35
