name: Archived EOG-NEON provenance
on:
  push:
    paths:
      - 'archive/eog_legacy_neon_20261122/**'
      - 'scripts/verify_legacy_eog_archive.py'
  pull_request:
    paths:
      - 'archive/eog_legacy_neon_20261122/**'
      - 'scripts/verify_legacy_eog_archive.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Audit exact historical Git blob hashes (no biological scoring)
        run: python scripts/verify_legacy_eog_archive.py
