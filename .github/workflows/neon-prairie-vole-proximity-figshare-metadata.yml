name: neon-prairie-vole-proximity-figshare-metadata
on:
  push:
    branches:
      - design/multiscale-density-accommodation-v1
    paths:
      - 'analysis/run_neon_prairie_vole_figshare_source_preflight_v1.py'
      - 'tests/test_neon_prairie_vole_figshare_source_preflight_v1.py'
      - 'docs/NEON_PRAIRIE_VOLE_DIRECT_CONTACT_SOURCE_GATE_20261115.md'
      - '.github/workflows/neon-prairie-vole-proximity-figshare-metadata.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: neon-prairie-vole-public-source-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source-only-public-figshare-project:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate mock Figshare public metadata only
        run: python -m unittest discover -s tests -p 'test_neon_prairie_vole_figshare_source_preflight_v1.py' -v
      - name: Retrieve real public original project and article file manifests only
        run: python -m analysis.run_neon_prairie_vole_figshare_source_preflight_v1
      - name: Archive anonymous public metadata source support or STOP
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neon-prairie-vole-direct-contact-public-manifest
          path: build/neon_prairie_vole_logger_figshare_metadata_20261115.json
          if-no-files-found: warn
          retention-days: 45
