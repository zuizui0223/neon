name: multiscale-density-observation-support

on:
  push:
    branches:
      - design/multiscale-density-accommodation-v1
    paths:
      - "analysis/audit_multiscale_density_observation_support_v1.py"
      - "analysis/audit_multiscale_density_mnka_variation_v1.py"
      - "analysis/run_multiscale_density_development_fit_v1.py"
      - "results/multiscale_density_development_result_v1.json"
      - ".github/workflows/multiscale-density-observation-support.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: multiscale-density-observation-support-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: macos-14
    timeout-minutes: 30
    env:
      NEON_API_TOKEN: ${{ secrets.NEON_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependency
        run: python -m pip install numpy==2.1.1
      - name: Require NEON access
        run: test -n "$NEON_API_TOKEN"
      - name: Run observation-support audit
        run: python -m analysis.audit_multiscale_density_observation_support_v1
      - name: Upload observation-support receipt
        uses: actions/upload-artifact@v4
        with:
          name: multiscale-density-observation-support-v1
          path: build/multiscale_density_observation_support_audit_v1.json
          if-no-files-found: error
          retention-days: 30
