name: neon-molecular-history-review
on:
  push:
    branches: [design/multiscale-density-accommodation-v1]
    paths:
      - analysis/review_neon_molecular_history_v1.py
      - tests/test_neon_molecular_history_review_v1.py
      - .github/workflows/neon-molecular-history-review.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: molecular-history-review-${{ github.ref }}
  cancel-in-progress: true
jobs:
  provenance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEON_API_TOKEN: ${{ secrets.NEON_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate source-only reason interpretation
        run: python -m unittest discover -s tests -p 'test_neon_molecular_history_review_v1.py' -v
      - name: Verify provider revision reason evidence
        run: python -m analysis.review_neon_molecular_history_v1
      - name: Archive aggregate provider-provenance result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neon-molecular-history-review-v1
          path: build/neon_molecular_history_review_v1.json
          if-no-files-found: warn
          retention-days: 45
