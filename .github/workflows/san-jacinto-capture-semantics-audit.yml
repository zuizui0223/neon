name: san-jacinto-capture-semantics-audit

on:
  push:
    branches:
      - design/san-jacinto-crossscale-source-v1
    paths:
      - analysis/audit_san_jacinto_capture_semantics_v1.py
      - tests/test_san_jacinto_capture_semantics.py
      - .github/workflows/san-jacinto-capture-semantics-audit.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: design/san-jacinto-crossscale-source-v1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify semantic audit tests
        run: python -m unittest tests.test_san_jacinto_capture_semantics -v

      - name: Audit capture semantics without sex-specific counts
        run: |
          python analysis/audit_san_jacinto_capture_semantics_v1.py \
            --source-receipt validation/san_jacinto_crossscale_v1/source_schema_audit_v1.json \
            --cache data/cache/san_jacinto/year_round_trap_data.csv \
            --output /tmp/san_jacinto_capture_semantics_audit_v1.json

      - name: Assert effect-blind boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path("/tmp/san_jacinto_capture_semantics_audit_v1.json").read_text())
          assert p["species_specific_support_counts_inspected"] is False
          assert p["sex_specific_support_counts_inspected"] is False
          assert p["movement_distances_computed"] is False
          assert p["packing_effects_computed"] is False
          assert p["ecological_effect_models_fit"] == 0
          print(json.dumps(p,indent=2,sort_keys=True))
          PY

      - name: Persist semantic receipt
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin design/san-jacinto-crossscale-source-v1
          cp /tmp/san_jacinto_capture_semantics_audit_v1.json \
             validation/san_jacinto_crossscale_v1/capture_semantics_audit_v1.json
          git add validation/san_jacinto_crossscale_v1/capture_semantics_audit_v1.json
          if git diff --cached --quiet; then
            echo "semantic receipt unchanged"
          else
            git commit -m "Freeze San Jacinto capture semantics audit"
            git push origin HEAD:design/san-jacinto-crossscale-source-v1
          fi
