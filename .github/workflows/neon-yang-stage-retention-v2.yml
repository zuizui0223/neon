name: neon-yang-stage-retention-v2
on:
  push:
    branches: [design/multiscale-density-accommodation-v1]
    paths:
      - 'analysis/run_neon_yang_stage_retention_v2.py'
      - 'tests/test_neon_yang_stage_retention_v2.py'
      - '.github/workflows/neon-yang-stage-retention-v2.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fixed-source-block-stage:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install openpyxl==3.1.5
      - run: python -m unittest discover -s tests -p 'test_neon_yang_stage_retention_v2.py' -v
      - run: python -m analysis.run_neon_yang_stage_retention_v2
      - uses: actions/upload-artifact@v4
        with:
          name: neon-yang-stage-retention-v2
          path: build/neon_yang_stage_retention_v2_20261124.json
          if-no-files-found: error
