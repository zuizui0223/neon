name: frozen-paper-checks
on: [push, pull_request]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify frozen result invariants
        run: python -m unittest discover -s tests -v
      - name: Rebuild manuscript figures and supplement
        run: python analysis/build_paper_assets.py
