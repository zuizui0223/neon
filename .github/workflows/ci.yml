name: frozen-paper-checks
on: [push, pull_request]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install submission build dependencies
        run: python -m pip install python-docx==1.1.2 cairosvg==2.7.1

      - name: Recompute exploratory carrier turnover
        run: python analysis/carrier_turnover_v1.py

      - name: Recompute all-carrier niche-role audit
        run: python analysis/carrier_niche_role_v2.py

      - name: Verify frozen result and submission invariants
        run: python -m unittest discover -s tests -v

      - name: Rebuild manuscript figures and supplement
        run: |
          python analysis/build_paper_assets.py
          python analysis/build_carrier_turnover_figure_v1.py

      - name: Build Oikos figure PNGs
        run: |
          python submission/build_oikos_figure_pngs.py
          python submission/check_oikos_figure_pngs.py

      - name: Build anonymous Oikos manuscript DOCX
        run: |
          python submission/build_oikos_manuscript_docx.py
          python submission/check_oikos_manuscript_docx.py

      - name: Build anonymous review package
        run: |
          python submission/build_anonymous_review_package.py
          python submission/check_anonymous_review_package.py
          sha256sum dist/oikos_anonymous_review_package.zip | awk '{print $1}' > /tmp/review_zip_hash_1
          python submission/build_anonymous_review_package.py
          python submission/check_anonymous_review_package.py
          sha256sum dist/oikos_anonymous_review_package.zip | awk '{print $1}' > /tmp/review_zip_hash_2
          diff -u /tmp/review_zip_hash_1 /tmp/review_zip_hash_2

      - name: Upload Oikos submission artifacts
        uses: actions/upload-artifact@v4
        with:
          name: oikos-initial-submission-artifacts
          path: |
            dist/oikos_main_text_anonymous.docx
            dist/oikos_anonymous_review_package.zip
            dist/figures/Figure_1.png
            dist/figures/Figure_2.png
            dist/figures/Figure_3.png
            dist/figures/Figure_4.png
          if-no-files-found: error
          retention-days: 30
