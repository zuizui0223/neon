name: NEON Merz seasonal identity support V7
on:
  push:
    branches: [analysis/seasonal-seed-fate-stage-v1-20261125]
    paths:
      - '.github/workflows/neon-merz-support-v7.yml'
permissions:
  contents: read
jobs:
  support:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Inspect pinned source keys and repeated actor support
        run: python3 analysis/audit_neon_merz_support_v7.py
      - uses: actions/upload-artifact@v4
        with:
          name: merz-support-v7
          path: merz_support.json
          if-no-files-found: error
