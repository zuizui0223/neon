name: public-mammal-phase1-estimability

on:
  push:
    branches:
      - design/public-mammal-space-use-v1
    paths:
      - analysis/audit_public_mammal_estimability_v1.py
      - analysis/public_mammal_context_v1.py
      - data/external/neon_nlcd_group_lookup_v1.csv
      - .github/workflows/public-mammal-phase1-estimability.yml
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  estimability:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: design/public-mammal-space-use-v1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Discover latest source-specific development artifacts
        id: discover
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          BRANCH: design/public-mammal-space-use-v1
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request
          from pathlib import Path

          token=os.environ["GITHUB_TOKEN"]
          repo=os.environ["REPOSITORY"]
          branch=os.environ["BRANCH"]
          names={
              "portal":"public-mammal-portal-development-v1",
              "neon":"public-mammal-neon-development-v1",
          }
          chosen={}

          def request_json(url):
              req=urllib.request.Request(
                  url,
                  headers={
                      "Authorization":f"Bearer {token}",
                      "Accept":"application/vnd.github+json",
                      "X-GitHub-Api-Version":"2022-11-28",
                  },
              )
              with urllib.request.urlopen(req,timeout=60) as response:
                  return json.loads(response.read().decode("utf-8"))

          for label,name in names.items():
              url=(
                  f"https://api.github.com/repos/{repo}/actions/artifacts?"
                  + urllib.parse.urlencode({"name":name,"per_page":100})
              )
              payload=request_json(url)
              candidates=[
                  row for row in payload.get("artifacts",[])
                  if not row.get("expired",False)
                  and (row.get("workflow_run") or {}).get("head_branch")==branch
              ]
              if not candidates:
                  raise RuntimeError(f"no non-expired {name} artifact for {branch}")
              artifact=max(candidates,key=lambda row:row["created_at"])
              run=artifact.get("workflow_run") or {}
              run_id=run.get("id")
              if not run_id:
                  raise RuntimeError(f"{name} artifact lacks workflow run ID")
              chosen[label]={
                  "artifact_id":artifact["id"],
                  "name":artifact["name"],
                  "digest":artifact.get("digest"),
                  "created_at":artifact["created_at"],
                  "workflow_run_id":run_id,
                  "workflow_head_sha":run.get("head_sha"),
              }

          out=Path("results/generated/public_mammal_estimability_source_artifacts_v1.json")
          out.parent.mkdir(parents=True,exist_ok=True)
          out.write_text(
              json.dumps(chosen,indent=2,sort_keys=True)+"\n",
              encoding="utf-8",
          )
          github_output=Path(os.environ["GITHUB_OUTPUT"])
          with github_output.open("a",encoding="utf-8") as fh:
              fh.write(f"portal_run_id={chosen['portal']['workflow_run_id']}\n")
              fh.write(f"neon_run_id={chosen['neon']['workflow_run_id']}\n")
          print(json.dumps(chosen,indent=2,sort_keys=True))
          PY

      - name: Download Portal development artifact
        uses: actions/download-artifact@v4
        with:
          name: public-mammal-portal-development-v1
          path: results/generated/phase1_inputs/portal
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.discover.outputs.portal_run_id }}

      - name: Download NEON development artifact
        uses: actions/download-artifact@v4
        with:
          name: public-mammal-neon-development-v1
          path: results/generated/phase1_inputs/neon
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.discover.outputs.neon_run_id }}

      - name: Recompute cross-dataset Phase-1 estimability
        run: |
          python analysis/audit_public_mammal_estimability_v1.py \
            --portal-sessions results/generated/phase1_inputs/portal/portal_space_use_sessions_v1.csv \
            --neon-sessions results/generated/phase1_inputs/neon/neon_diversity_space_use_sessions_v1.csv \
            --neon-inventory results/generated/phase1_inputs/neon/neon_space_use_inventory_v1.json \
            --output-json results/public_mammal_estimability_v1.json \
            --output-csv data/derived/public_mammal_session_inventory_v1.csv \
            --output-md docs/PUBLIC_MAMMAL_ESTIMABILITY_V1.md

      - name: Persist Phase-1 estimability result
        run: |
          cp results/generated/public_mammal_estimability_source_artifacts_v1.json \
             validation/public_mammal_space_use_v1/phase1_source_artifacts_v1.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/public_mammal_estimability_v1.json
          git add data/derived/public_mammal_session_inventory_v1.csv
          git add docs/PUBLIC_MAMMAL_ESTIMABILITY_V1.md
          git add validation/public_mammal_space_use_v1/phase1_source_artifacts_v1.json
          if git diff --cached --quiet; then
            echo "Phase-1 estimability outputs unchanged"
          else
            git commit -m "Freeze public mammal Phase-1 estimability"
            git push origin HEAD:design/public-mammal-space-use-v1
          fi
