name: san-jacinto-stage5-temporal-persistence

on:
  push:
    branches:
      - ecology/san-jacinto-transition-niche-v1
    paths:
      - analysis/test_san_jacinto_stage5_temporal_persistence_v1.R
      - .github/workflows/san-jacinto-stage5-temporal-persistence.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: san-jacinto-stage5-temporal-persistence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stage5:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ecology/san-jacinto-transition-niche-v1
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Install dependencies and EcoSimR source
        run: |
          Rscript -e 'install.packages("jsonlite", repos="https://cloud.r-project.org")'
          git clone --depth 1 https://github.com/GotelliLab/EcoSimR.git /tmp/EcoSimR
          R CMD INSTALL /tmp/EcoSimR
      - name: Verify Stage-5 helper
        run: Rscript analysis/test_san_jacinto_stage5_temporal_persistence_v1.R --self-test
      - name: Run frozen temporal persistence test
        run: |
          Rscript analysis/test_san_jacinto_stage5_temporal_persistence_v1.R \
            --cache /tmp/year_round_trap_data.csv \
            --output /tmp/san_jacinto_stage5_temporal_persistence_v1.json \
            --nreps 5000 --burn 500 --seed 2026100505
      - name: Persist Stage-5 result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin ecology/san-jacinto-transition-niche-v1
          cp /tmp/san_jacinto_stage5_temporal_persistence_v1.json \
             results/san_jacinto_stage5_temporal_persistence_v1.json
          git add results/san_jacinto_stage5_temporal_persistence_v1.json
          if git diff --cached --quiet; then
            echo "Stage-5 result unchanged"
          else
            git commit -m "Record temporal persistence test"
            git push origin HEAD:ecology/san-jacinto-transition-niche-v1
          fi
