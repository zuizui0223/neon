name: scr-sigma-consequence-simulation

on:
  push:
    branches:
      - design/san-jacinto-scr-sigma-impact-v1
    paths:
      - docs/SCR_SIGMA_CONSEQUENCE_SIMULATION_DESIGN_V1.md
      - analysis/simulate_scr_sigma_consequence_v1.R
      - .github/workflows/scr-sigma-consequence-simulation.yml
  workflow_dispatch:

concurrency:
  group: scr-sigma-consequence-\${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  simulate:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      R_LIBS_USER: ${{ github.workspace }}/.R/library
    steps:
      - uses: actions/checkout@v4
        with:
          ref: design/san-jacinto-scr-sigma-impact-v1

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::secr
            any::jsonlite

      - name: Download and verify frozen San Jacinto source
        run: |
          mkdir -p data/cache/san_jacinto
          curl -L --fail --retry 4             https://ndownloader.figshare.com/files/33058799             -o data/cache/san_jacinto/year_round_trap_data.csv
          echo "ec70b40fdcc66a3f9c07a3fda64b5eda06d251a899b9bc99cc5c5dff8c4ab301  data/cache/san_jacinto/year_round_trap_data.csv"             | sha256sum -c -

      - name: Run frozen SCR sigma consequence simulation
        run: |
          Rscript analysis/simulate_scr_sigma_consequence_v1.R             --source data/cache/san_jacinto/year_round_trap_data.csv             --nrepl 40             --cores 2             --seed 20261001             --output-json results/scr_sigma_consequence_simulation_v1.json             --output-csv results/scr_sigma_consequence_replicates_v1.csv

      - name: Verify result contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          p=json.loads(Path("results/scr_sigma_consequence_simulation_v1.json").read_text())
          assert p["schema"]=="neon.scr_sigma_consequence_simulation.v1"
          assert p["nrepl_per_cell"]==40
          assert p["empirical_anchor"]["pooled"]["all_valid_captured_nights"]==1520
          assert p["empirical_anchor"]["pooled"]["repeat_capture_nights"]==592
          assert p["empirical_anchor"]["pooled"]["changed_repeat_nights"]==426
          assert p["diagnostic_checks"]["empirical_real_data_sigma_opened"] is False

          summaries=p["summaries"]
          assert len(summaries)==27, len(summaries)
          methods={x["method"] for x in summaries}
          assert methods=={"CHECK","FIRST","LAST"}

          failures=[x for x in summaries if x["failure_fraction"] is not None and x["failure_fraction"]>0.25]
          if failures:
              raise SystemExit(f"too many fit failures in cells: {failures}")
          PY

      - name: Upload simulation artifact
        uses: actions/upload-artifact@v4
        with:
          name: scr-sigma-consequence-simulation-v1
          path: |
            results/scr_sigma_consequence_simulation_v1.json
            results/scr_sigma_consequence_replicates_v1.csv
          if-no-files-found: error

      - name: Persist simulation results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin design/san-jacinto-scr-sigma-impact-v1
          git add results/scr_sigma_consequence_simulation_v1.json
          git add results/scr_sigma_consequence_replicates_v1.csv
          if git diff --cached --quiet; then
            echo "simulation results unchanged"
          else
            git commit -m "Run SCR sigma consequence simulation v1"
            git push origin HEAD:design/san-jacinto-scr-sigma-impact-v1
          fi
