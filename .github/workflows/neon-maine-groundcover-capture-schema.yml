name: neon-maine-groundcover-capture-schema
on:
  push:
    branches: [design/multiscale-density-accommodation-v1]
    paths:
      - 'analysis/audit_neon_maine_groundcover_capture_schema_v1.py'
      - 'tests/test_neon_maine_groundcover_capture_schema_v1.py'
      - '.github/workflows/neon-maine-groundcover-capture-schema.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  codebook-and-source-profile:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p 'test_neon_maine_groundcover_capture_schema_v1.py' -v
      - run: python -m analysis.audit_neon_maine_groundcover_capture_schema_v1
      - uses: actions/upload-artifact@v4
        with:
          name: neon-maine-groundcover-capture-schema
          path: build/neon_maine_groundcover_capture_schema_20261125.json
          if-no-files-found: error
