name: san-jacinto-cross-scale-link-audit

on:
  push:
    branches:
      - ecology/san-jacinto-transition-niche-v1
    paths:
      - analysis/audit_san_jacinto_cross_scale_link_v1.py
      - tests/test_san_jacinto_cross_scale_link_v1.py
      - .github/workflows/san-jacinto-cross-scale-link-audit.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ecology/san-jacinto-transition-niche-v1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install numpy
      - name: Verify audit
        run: python -m unittest tests.test_san_jacinto_cross_scale_link_v1 -v
      - name: Run cross-scale audit
        run: |
          python analysis/audit_san_jacinto_cross_scale_link_v1.py \
            --footprint results/san_jacinto_individual_footprint_assortativity_v1.json \
            --stage4 results/san_jacinto_public30_scale_decomposition_v1.json \
            --output /tmp/san_jacinto_cross_scale_link_audit_v1.json
      - name: Persist audit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin ecology/san-jacinto-transition-niche-v1
          cp /tmp/san_jacinto_cross_scale_link_audit_v1.json results/san_jacinto_cross_scale_link_audit_v1.json
          git add results/san_jacinto_cross_scale_link_audit_v1.json
          if git diff --cached --quiet; then echo unchanged; else
            git commit -m "Audit individual-to-community scale link"
            git push origin HEAD:ecology/san-jacinto-transition-niche-v1
          fi
