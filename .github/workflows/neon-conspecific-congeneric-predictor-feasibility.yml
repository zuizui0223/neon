name: neon-conspecific-congeneric-predictor-feasibility

on:
  push:
    branches:
      - design/multiscale-density-accommodation-v1
    paths:
      - "analysis/conspecific_congeneric_predictor_support_v1.py"
      - "analysis/run_conspecific_congeneric_predictor_feasibility_v1.py"
      - "tests/test_conspecific_congeneric_predictor_support_v1.py"
      - ".github/workflows/neon-conspecific-congeneric-predictor-feasibility.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: conspecific-congeneric-feasibility-${{ github.ref }}
  cancel-in-progress: true

jobs:
  predictor-only:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      NEON_API_TOKEN: ${{ secrets.NEON_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install source-only linear algebra
        run: python -m pip install numpy==2.1.1
      - name: Validate synthetic biological taxonomy and two-predictor geometry
        run: python -m unittest discover -s tests -p 'test_conspecific_congeneric_predictor_support_v1.py' -v
      - name: Require existing NEON release-access token
        run: test -n "$NEON_API_TOKEN"
      - name: Audit public NEON RELEASE-2026 abundance composition only
        run: python -m analysis.run_conspecific_congeneric_predictor_feasibility_v1
      - name: Archive aggregate predictor feasibility only, NO W/B
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neon-conspecific-congeneric-predictor-feasibility-v1
          path: build/conspecific_congeneric_predictor_feasibility_v1.json
          if-no-files-found: warn
          retention-days: 35
