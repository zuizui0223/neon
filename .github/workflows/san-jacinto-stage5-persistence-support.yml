name: san-jacinto-stage5-persistence-support

on:
  push:
    branches:
      - ecology/san-jacinto-transition-niche-v1
    paths:
      - analysis/audit_san_jacinto_stage5_persistence_support_v1.py
      - tests/test_san_jacinto_stage5_persistence_support_v1.py
      - .github/workflows/san-jacinto-stage5-persistence-support.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: san-jacinto-stage5-persistence-support-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ecology/san-jacinto-transition-niche-v1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify support-only split logic
        run: python -m unittest tests.test_san_jacinto_stage5_persistence_support_v1 -v
      - name: Inventory early-late support only
        run: |
          python analysis/audit_san_jacinto_stage5_persistence_support_v1.py \
            --output /tmp/san_jacinto_stage5_persistence_support_v1.json
      - name: Persist support audit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin ecology/san-jacinto-transition-niche-v1
          cp /tmp/san_jacinto_stage5_persistence_support_v1.json \
             results/san_jacinto_stage5_persistence_support_v1.json
          git add results/san_jacinto_stage5_persistence_support_v1.json
          if git diff --cached --quiet; then
            echo "support audit unchanged"
          else
            git commit -m "Record Stage-5 persistence support audit"
            git push origin HEAD:ecology/san-jacinto-transition-niche-v1
          fi
