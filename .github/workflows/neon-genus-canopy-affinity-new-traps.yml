name: neon-genus-canopy-affinity-at-new-traps
on:
  push:
    branches:
      - design/multiscale-density-accommodation-v1
    paths:
      - 'analysis/neon_nonidentical_trap_CHM_affinity_v1.py'
      - 'analysis/run_neon_nonidentical_trap_CHM_affinity_v1.py'
      - 'tests/test_neon_nonidentical_trap_CHM_affinity_v1.py'
      - 'docs/NEON_CANOPY_AFFINITY_NOVEL_STATIONS_FROZEN_20261122.md'
      - '.github/workflows/neon-genus-canopy-affinity-new-traps.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'analysis/neon_nonidentical_trap_CHM_affinity_v1.py'
      - 'analysis/run_neon_nonidentical_trap_CHM_affinity_v1.py'
      - 'tests/test_neon_nonidentical_trap_CHM_affinity_v1.py'
      - 'docs/NEON_CANOPY_AFFINITY_NOVEL_STATIONS_FROZEN_20261122.md'
      - '.github/workflows/neon-genus-canopy-affinity-new-traps.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: neon-canopy-new-trap-genus-null-${{ github.ref }}
  cancel-in-progress: true
jobs:
  original-58-genus-pairs-and-51-AOP-tiles-structural-habitat-test:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      NEON_API_TOKEN: ${{ secrets.NEON_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pin previously verified AOP raster numerical stack
        run: python -m pip install numpy==2.1.1 rasterio==1.4.3
      - name: Check canopy rank tie handling, novel B trap exclusion, fixed margin null and physical site inference
        run: python -m unittest discover -s tests -p 'test_neon_nonidentical_trap_CHM_affinity_v1.py' -v
      - name: Verify authorized original NEON source and immutable prior source receipt
        run: |
          test -n "$NEON_API_TOKEN"
          test -f results/neon_historical_chm_actual_pixel_source_receipt_20261028.json
      - name: Re-fetch exact original source checksums 51 AOP CHM raster tiles and freeze source selected 36 season pairs
        run: python -m analysis.run_neon_nonidentical_trap_CHM_affinity_v1
      - name: Archive anonymous ecological exploratory GO or scientific STOP without site/genus/station labels
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neon-canopy-new-trap-genus-habitat-association-original
          path: build/neon_nonidentical_trap_CHM_affinity_20261122.json
          if-no-files-found: warn
          retention-days: 45
