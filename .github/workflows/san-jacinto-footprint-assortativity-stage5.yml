name: san-jacinto-footprint-assortativity-stage5

on:
  push:
    branches:
      - ecology/san-jacinto-transition-niche-v1
    paths:
      - docs/SAN_JACINTO_TRANSITION_NICHE_EXPLORATION_V1.md
      - analysis/test_san_jacinto_individual_footprint_assortativity_v1.py
      - tests/test_san_jacinto_individual_footprint_assortativity_v1.py
      - .github/workflows/san-jacinto-footprint-assortativity-stage5.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: san-jacinto-footprint-assortativity-stage5-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stage5:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ecology/san-jacinto-transition-niche-v1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install numerical dependency
        run: python -m pip install numpy

      - name: Verify frozen Stage-5 implementation
        run: python -m unittest tests.test_san_jacinto_individual_footprint_assortativity_v1 -v

      - name: Run footprint-size-stratified individual assortativity test
        run: |
          python analysis/test_san_jacinto_individual_footprint_assortativity_v1.py \
            --cache /tmp/year_round_trap_data.csv \
            --stage4-result results/san_jacinto_public_data_scale_decomposition_v1.json \
            --output /tmp/san_jacinto_individual_footprint_assortativity_v1.json \
            --permutations 10000 \
            --seed 2026100505

      - name: Persist Stage-5 result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin ecology/san-jacinto-transition-niche-v1
          cp /tmp/san_jacinto_individual_footprint_assortativity_v1.json \
             results/san_jacinto_individual_footprint_assortativity_v1.json
          git add results/san_jacinto_individual_footprint_assortativity_v1.json
          if git diff --cached --quiet; then
            echo "Stage-5 result unchanged"
          else
            git commit -m "Record individual multi-night footprint assortativity"
            git push origin HEAD:ecology/san-jacinto-transition-niche-v1
          fi
